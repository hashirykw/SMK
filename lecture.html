<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lecture — Sir Mehboob Khan</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="favicon.ico" sizes="any">
<meta name="theme-color" content="#F4EBE0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500;6..72,600;6..72,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>


/* ==========================================================================
   SIR MEHBOOB KHAN — v3
   Type: Fraunces (display) · Inter Tight (UI) · Space Mono (labels)
   ========================================================================== */

:root{
  --navy-950:#050B18; --navy-900:#081226; --navy-800:#0E1B36;
  --navy-700:#16294B; --navy-600:#1F3A66;
  --gold-600:#A8752A; --gold-500:#C08A34; --gold-400:#D49C42;
  --gold-300:#E0A94C; --gold-100:#F2DDB4;
  --ice:#7FA8E8; --paper:#F4EBE0; --ink:#F3EEE3; --dim:#98A2B8;
  --ok:#42B07C; --bad:#D0574B;

  --bg:var(--navy-950);
  --panel:rgba(255,255,255,.032);
  --panel-2:rgba(255,255,255,.055);
  --line:rgba(224,169,76,.17);
  --line-soft:rgba(255,255,255,.09);
  --text:var(--ink); --muted:var(--dim);

  --display:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Plus Jakarta Sans","Inter",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  --r:14px; --r-lg:22px; --max:1300px;
  --ease:cubic-bezier(.22,.8,.32,1);
  --spring:cubic-bezier(.34,1.4,.64,1);
}
[data-theme="light"]{
  --bg:var(--paper); --panel:rgba(8,18,38,.04); --panel-2:rgba(8,18,38,.07);
  --line:rgba(168,117,42,.3); --line-soft:rgba(8,18,38,.11);
  --text:#0B1730; --muted:#54607A; --navy-800:#FBF6EF; --navy-900:#EADFD1;
}
[data-theme="focus"]{
  --bg:#fff; --panel:#fff; --panel-2:#F1F1F1; --line:#000; --line-soft:#000;
  --text:#000; --muted:#262626; --navy-800:#fff; --navy-900:#fff;
  --gold-500:#7A5312; --gold-400:#7A5312; --gold-300:#7A5312;
}
[data-theme="focus"] *{animation:none!important;transition:none!important}
[data-theme="focus"] .orb,[data-theme="focus"] #stars,[data-theme="focus"] .cur,
[data-theme="focus"] .cur-d,[data-theme="focus"] .aura{display:none!important}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:92px}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);letter-spacing:-.008em;
  font-size:16.5px;line-height:1.62;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.lock{overflow:hidden;position:fixed;width:100%}
img{max-width:100%;display:block;height:auto}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit}
h1,h2,h3,h4{font-family:var(--display);font-weight:500;line-height:1.08;
  letter-spacing:-.014em;margin:0 0 .5em;font-optical-sizing:auto}
h1{font-weight:400}
h1{font-size:clamp(2.5rem,6.6vw,5.4rem)}
h2{font-size:clamp(1.95rem,4.1vw,3.15rem)}
h3{font-size:clamp(1.2rem,2vw,1.5rem)}
p{margin:0 0 1rem;max-width:64ch}
:focus-visible{outline:2px solid var(--gold-300);outline-offset:3px;border-radius:6px}
::selection{background:var(--gold-500);color:#12203C}

/* ---- custom scrollbar ---- */
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--navy-900)}
[data-theme="light"] ::-webkit-scrollbar-track{background:#E4D9C9}
::-webkit-scrollbar-thumb{border-radius:99px;border:3px solid transparent;
  background-clip:content-box;background-color:var(--gold-600)}
::-webkit-scrollbar-thumb:hover{background-color:var(--gold-400)}
html{scrollbar-width:thin;scrollbar-color:var(--gold-600) var(--navy-900)}

.wrap{width:100%;max-width:var(--max);margin-inline:auto;padding-inline:clamp(18px,4vw,40px)}
.sec{padding-block:clamp(74px,9vw,150px);position:relative}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);
  font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-400);margin-bottom:20px}
.eyebrow::before{content:"";width:6px;height:6px;background:var(--gold-500);transform:rotate(45deg)}
.lede{font-size:clamp(1rem,1.4vw,1.16rem);color:var(--muted);max-width:56ch}

/* ================= PRELOADER — orbital mechanics ================= */
#pre{position:fixed;inset:0;z-index:9999;background:var(--bg);display:grid;
  place-items:center;transition:opacity .8s var(--ease),visibility .8s}
#pre.gone{opacity:0;visibility:hidden;pointer-events:none}
.pl{display:grid;place-items:center;gap:0}
.pl__sys{position:relative;width:min(190px,44vw);aspect-ratio:1/1;display:grid;place-items:center}
.pl__sun{width:42%;z-index:3;filter:drop-shadow(0 0 30px rgba(192,138,52,.42));
  animation:plsun 3s ease-in-out infinite}
@keyframes plsun{50%{transform:scale(1.06)}}
.pl__o{position:absolute;border:1px solid rgba(192,138,52,.34);border-radius:50%;
  transform-style:preserve-3d}
.pl__o:nth-of-type(1){inset:26%;animation:plo 4.2s linear infinite}
.pl__o:nth-of-type(2){inset:13%;animation:plo 6.4s linear infinite reverse}
.pl__o:nth-of-type(3){inset:0;animation:plo 9s linear infinite}
@keyframes plo{to{transform:rotate(360deg)}}
.pl__p{position:absolute;border-radius:50%;background:var(--gold-300);
  box-shadow:0 0 14px var(--gold-400)}
.pl__o:nth-of-type(1) .pl__p{width:7px;height:7px;top:-4px;left:calc(50% - 3.5px)}
.pl__o:nth-of-type(2) .pl__p{width:9px;height:9px;top:calc(50% - 4.5px);right:-5px;
  background:var(--ice);box-shadow:0 0 14px var(--ice)}
.pl__o:nth-of-type(3) .pl__p{width:5px;height:5px;bottom:-3px;left:calc(50% - 2.5px)}
.pl__t{width:min(250px,56vw);height:2px;background:var(--line-soft);
  margin-top:36px;border-radius:9px;overflow:hidden}
.pl__b{height:100%;width:0;background:linear-gradient(90deg,var(--gold-600),var(--gold-300));
  transition:width .3s linear}
.pl__x{margin-top:15px;font-family:var(--mono);font-size:.63rem;letter-spacing:.28em;
  color:var(--gold-400);text-transform:uppercase;min-height:1em}

/* ================= cursor / starfield ================= */
.cur,.cur-d{position:fixed;top:0;left:0;pointer-events:none;z-index:9000;
  border-radius:50%;translate:-50% -50%}
.cur{width:34px;height:34px;border:1px solid var(--gold-400);
  transition:width .25s var(--ease),height .25s var(--ease),background-color .25s}
.cur.on{width:66px;height:66px;background:rgba(192,138,52,.1)}
.cur-d{width:5px;height:5px;background:var(--gold-300)}
@media (hover:none),(pointer:coarse){.cur,.cur-d{display:none}}
#stars{position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.55}
.aura{position:fixed;width:70vmax;height:70vmax;border-radius:50%;z-index:-1;
  pointer-events:none;top:-26vmax;right:-18vmax;filter:blur(20px);
  background:radial-gradient(circle,rgba(192,138,52,.1),transparent 62%)}

/* ================= header ================= */
.hdr{position:fixed;top:0;left:0;right:0;z-index:500;border-bottom:1px solid transparent;
  transition:transform .45s var(--ease),background-color .35s,backdrop-filter .35s,border-color .35s}
.hdr.stuck{background:color-mix(in srgb,var(--bg) 80%,transparent);
  backdrop-filter:blur(18px) saturate(1.4);border-bottom-color:var(--line-soft)}
.hdr.hide{transform:translateY(-105%)}
.hdr__in{display:flex;align-items:center;gap:26px;min-height:78px;max-width:var(--max);
  margin-inline:auto;padding-inline:clamp(18px,4vw,40px)}
.logo{display:flex;align-items:center;gap:11px;flex:none}
.logo img{height:40px}
.logo b{font-family:var(--display);font-weight:600;font-size:.98rem;letter-spacing:.02em;line-height:1.1;white-space:nowrap}
.logo b i{color:var(--gold-400);font-style:normal}
.nav{display:flex;gap:25px;margin-left:auto;align-items:center}
.nav a{font-size:.87rem;font-weight:500;position:relative;padding:5px 0;white-space:nowrap}
.nav a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:0;
  background:var(--gold-400);transition:width .3s var(--ease)}
.nav a:hover::after,.nav a.on::after{width:100%}
.nav a.on{color:var(--gold-300)}
.hdr__cta{display:flex;gap:10px;align-items:center;margin-left:16px}

/* burger + COMPACT dropdown (no more full-screen takeover) */
.burger{display:none;width:46px;height:46px;margin-left:auto;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;border:1px solid var(--line-soft);
  border-radius:12px;background:var(--panel)}
.burger i{width:19px;height:1.6px;background:var(--text);transition:.35s var(--ease);display:block}
.burger.x i:nth-child(1){transform:translateY(6.6px) rotate(45deg)}
.burger.x i:nth-child(2){opacity:0}
.burger.x i:nth-child(3){transform:translateY(-6.6px) rotate(-45deg)}
.mob{position:fixed;top:74px;left:12px;right:12px;z-index:490;display:none;
  background:color-mix(in srgb,var(--navy-800) 96%,transparent);backdrop-filter:blur(24px);
  border:1px solid var(--line);border-radius:20px;padding:10px;
  box-shadow:0 26px 70px rgba(0,0,0,.55);
  max-height:calc(100svh - 100px);overflow-y:auto;
  opacity:0;transform:translateY(-12px) scale(.98);transform-origin:top center;
  transition:opacity .28s var(--ease),transform .28s var(--ease),visibility .28s;visibility:hidden}
[data-theme="light"] .mob,[data-theme="focus"] .mob{background:var(--bg)}
.mob.open{opacity:1;transform:none;visibility:visible}
.mob a{display:flex;align-items:center;justify-content:space-between;gap:12px;
  font-size:.98rem;font-weight:500;padding:13px 15px;border-radius:12px;transition:background-color .2s}
.mob a:hover,.mob a:focus-visible{background:var(--panel-2)}
.mob a span{font-family:var(--mono);font-size:.62rem;color:var(--muted);letter-spacing:.1em}
.mob__sep{height:1px;background:var(--line-soft);margin:8px 6px}
.mob__row{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px}
.mob__row .btn{width:100%}

/* ================= buttons ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55em;
  padding:.94em 1.7em;border-radius:11px;font-size:.87rem;font-weight:600;
  position:relative;overflow:hidden;
  transition:transform .18s var(--spring),box-shadow .3s var(--ease),
    border-color .3s var(--ease),background-color .3s}
.btn:active{transform:scale(.96)}
.btn--gold{background:linear-gradient(135deg,var(--gold-600),var(--gold-300));color:#150F04;
  box-shadow:0 6px 26px rgba(192,138,52,.3);
  clip-path:polygon(0 0,calc(100% - 13px) 0,100% 13px,100% 100%,0 100%)}
.btn--gold:hover{box-shadow:0 12px 42px rgba(192,138,52,.48)}
.btn--gold::after{content:"";position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 32%,rgba(255,248,232,.6) 50%,transparent 68%);
  transform:translateX(-130%);transition:transform .55s var(--ease)}
.btn--gold:hover::after{transform:translateX(130%)}
.btn--line{border:1px solid var(--line);color:var(--text);background:var(--panel)}
.btn--line:hover{border-color:var(--gold-400);background:var(--panel-2)}
.btn--sm{padding:.64em 1.15em;font-size:.78rem}
.btn--wide{width:100%}

/* ================= hero ================= */
.hero{min-height:100svh;display:flex;align-items:center;justify-content:center;
  position:relative;padding-top:120px;padding-bottom:80px;overflow:hidden;text-align:center}
.hero__g{width:100%;max-width:900px;margin-inline:auto;position:relative;z-index:2}
.hero__g::before{content:"";position:absolute;inset:-6% -12%;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse 62% 58% at 50% 46%,
    color-mix(in srgb,var(--bg) 72%,transparent) 0%,
    color-mix(in srgb,var(--bg) 40%,transparent) 58%,transparent 82%)}
.hero .lede{margin-inline:auto}
.hero .eyebrow{justify-content:center}

/* galaxy backdrop */
.galaxy{position:absolute;inset:0;left:0;top:0;translate:none;z-index:0;pointer-events:none;
  width:100%;height:100%;display:grid;place-items:center;overflow:hidden}
.galaxy img{width:100%;height:100%;object-fit:cover;object-position:center;opacity:1}
.galaxy::after{content:"";position:absolute;inset:0;
  background:
    radial-gradient(ellipse 82% 78% at 50% 52%,
      transparent 0%,
      color-mix(in srgb,var(--bg) 22%,transparent) 52%,
      color-mix(in srgb,var(--bg) 62%,transparent) 80%,
      color-mix(in srgb,var(--bg) 94%,transparent) 100%),
    linear-gradient(var(--bg),transparent 14%,transparent 88%,var(--bg))}
[data-theme="light"] .galaxy img{opacity:.42;filter:saturate(1.2) brightness(.9)}
[data-theme="focus"] .galaxy{display:none}
.w{display:inline-block;overflow:hidden;vertical-align:bottom;
  padding-bottom:.18em;margin-bottom:-.18em}
.wi{display:inline-block;transform:translateY(112%);transition:transform .95s var(--ease)}
.ready .wi{transform:none}
.grad{background:linear-gradient(105deg,var(--gold-300),var(--gold-100) 45%,var(--gold-500));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hero__cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:36px;justify-content:center}
.hero__m{display:flex;gap:clamp(26px,5vw,64px);margin-top:52px;flex-wrap:wrap;justify-content:center}
.hero__m b{display:block;font-family:var(--display);font-weight:500;
  font-size:clamp(2.2rem,3.4vw,2.9rem);color:var(--gold-300);line-height:1}
.hero__m > div > span{display:block;font-family:var(--mono);font-size:.78rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);margin-top:8px}
.cue{position:absolute;bottom:24px;left:50%;translate:-50% 0;display:grid;justify-items:center;
  gap:8px;font-family:var(--mono);font-size:.6rem;letter-spacing:.25em;color:var(--muted);
  text-transform:uppercase}
.cue i{width:1px;height:40px;background:linear-gradient(var(--gold-400),transparent);
  animation:cue 2s ease-in-out infinite}
@keyframes cue{50%{opacity:.25;transform:scaleY(.6)}}
.stage{position:relative;aspect-ratio:1/1;width:100%;max-width:640px;margin-inline:auto;
  isolation:isolate}
.stage.up .stage__fb{opacity:0}
/* CSS orbital system — the no-WebGL version of the hero */
.core{width:16%;aspect-ratio:1;border-radius:50%;position:relative;
  background:radial-gradient(circle at 38% 34%,#FFF6E2,var(--gold-300) 42%,var(--gold-600));
  box-shadow:0 0 34px 6px rgba(224,169,76,.5),0 0 90px 24px rgba(192,138,52,.22);
  animation:corepulse 3.4s ease-in-out infinite}
@keyframes corepulse{50%{transform:scale(1.07);
  box-shadow:0 0 46px 9px rgba(224,169,76,.62),0 0 120px 32px rgba(192,138,52,.28)}}
.orb i{position:absolute;top:50%;left:-1px;translate:-50% -50%;
  width:11px;height:11px;border-radius:50%;background:var(--gold-300);
  box-shadow:0 0 14px 3px rgba(224,169,76,.75)}
.orb:nth-child(2) i{width:13px;height:13px}
.orb:nth-child(3) i{width:9px;height:9px}
.orb:nth-child(4) i{width:7px;height:7px;opacity:.8}
[data-theme="light"] .core{box-shadow:0 0 30px 5px rgba(192,138,52,.42),0 0 80px 20px rgba(192,138,52,.16)}
.orb{position:absolute;border:1px solid var(--gold-500);border-radius:50%;
  transform-style:preserve-3d}
.galaxy .orb{inset:auto;left:50%;top:50%;translate:-50% -50%}
.galaxy .orb:nth-child(2){width:42vmin;height:42vmin;animation:o1 26s linear infinite;opacity:.4}
.galaxy .orb:nth-child(3){width:58vmin;height:58vmin;animation:o2 40s linear infinite;opacity:.26}
.galaxy .orb:nth-child(4){width:74vmin;height:74vmin;animation:o3 58s linear infinite;opacity:.16}
@keyframes o1{to{transform:rotateX(73deg) rotateZ(360deg)}}
@keyframes o2{to{transform:rotateX(64deg) rotateY(18deg) rotateZ(-360deg)}}
@keyframes o3{to{transform:rotateX(79deg) rotateY(-12deg) rotateZ(360deg)}}
@keyframes o4{to{transform:rotateX(68deg) rotateY(22deg) rotateZ(-360deg)}}

/* ================= bento / tiles ================= */
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}
.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.tile{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r-lg);
  padding:clamp(22px,2.6vw,34px);position:relative;overflow:hidden;
  transition:transform .45s var(--ease),border-color .35s,box-shadow .45s var(--ease)}
.tile:hover{border-color:var(--line);box-shadow:0 24px 60px rgba(0,0,0,.4)}
.tile--glare::before{content:"";position:absolute;inset:0;opacity:0;transition:opacity .4s;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(224,169,76,.13),transparent 42%)}
.tile--glare:hover::before{opacity:1}
.tile__n{font-family:var(--display);font-weight:500;font-size:clamp(2.6rem,5vw,4.2rem);line-height:.9;
  color:var(--gold-300);letter-spacing:-.03em}
.tile__k{font-family:var(--mono);font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted);margin-top:10px;display:block}
.d3{transform-style:preserve-3d;transition:transform .55s var(--ease)}
.d3 > *{transform-style:preserve-3d}
.z1{transform:translateZ(26px)}
@media (hover:none){.z1{transform:none}}
.edge{position:relative;isolation:isolate}
.edge::before{content:"";position:absolute;inset:-1px;border-radius:inherit;z-index:-1;opacity:0;
  background:conic-gradient(from var(--a,0deg),transparent 0 55%,var(--gold-300) 75%,transparent 85%);
  transition:opacity .45s var(--ease)}
.edge:hover::before{opacity:1;animation:spin 3s linear infinite}
@keyframes spin{to{--a:360deg}}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}

/* ================= FLIP (used in many places now) ================= */
.flip{perspective:1600px}
.flip__i{position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transition:transform .82s cubic-bezier(.5,.1,.2,1)}
.flip:hover .flip__i,.flip:focus-within .flip__i,.flip.on .flip__i{transform:rotateY(180deg)}
.flip__f{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r-lg);
  border:1px solid var(--line-soft);padding:clamp(20px,2.3vw,30px);overflow:hidden;
  display:flex;flex-direction:column;background:var(--panel);backdrop-filter:blur(8px)}
.flip__f--b{transform:rotateY(180deg);
  background:color-mix(in srgb,var(--navy-700) 62%,transparent);
  border-color:rgba(224,169,76,.34)}
[data-theme="light"] .flip__f--b,[data-theme="focus"] .flip__f--b{background:var(--panel-2)}
.flip:hover .flip__f{box-shadow:0 34px 80px rgba(0,0,0,.5)}
.flip--course{height:436px}
.flip--sm{height:250px}
.flip__ring{position:absolute;right:-64px;top:-64px;width:200px;height:200px;border-radius:50%;
  border:1px solid var(--line);opacity:.55;transition:transform .9s var(--ease)}
.flip:hover .flip__ring{transform:scale(1.2) rotate(40deg)}
.flip__list{list-style:none;padding:0;margin:12px 0 0;font-size:.86rem;color:var(--muted);
  display:grid;gap:7px;overflow-y:auto;flex:1}
.flip__list li{display:flex;gap:9px;align-items:flex-start}
.flip__list li::before{content:"";width:5px;height:5px;background:var(--gold-500);
  transform:rotate(45deg);margin-top:7px;flex:none}
.flip__hint{margin-top:auto;font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;
  color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:7px}
.flip__hint i{width:14px;height:14px;border:1px solid var(--gold-500);border-radius:3px;
  display:inline-block;animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{50%{transform:rotateY(180deg)}}

/* ================= AFFILIATIONS ================= */
.affg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.aff{position:relative;border-radius:var(--r-lg);border:1px solid var(--line-soft);
  background:var(--panel);padding:22px 18px;text-align:center;overflow:hidden;
  transition:transform .45s var(--ease),border-color .35s,box-shadow .45s}
.aff:hover{transform:translateY(-7px);border-color:var(--gold-400);
  box-shadow:0 26px 60px rgba(0,0,0,.42)}
.aff__logo{height:78px;display:grid;place-items:center;margin-bottom:14px}
.aff__logo img{max-height:78px;width:auto;object-fit:contain;
  filter:brightness(1.06);transition:transform .45s var(--spring)}
.aff:hover .aff__logo img{transform:scale(1.07)}
.aff b{display:block;font-size:1rem;line-height:1.3}
.aff > span{display:block;font-family:var(--mono);font-size:.72rem;color:var(--muted);
  letter-spacing:.06em;margin-top:6px}
@media (max-width:900px){.affg{grid-template-columns:1fr 1fr}}
@media (max-width:420px){.affg{grid-template-columns:1fr 1fr;gap:10px}
  .aff{padding:16px 10px}.aff__logo,.aff__logo img{height:56px;max-height:56px}}

/* ================= steps ================= */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;position:relative}
.steps::before{content:"";position:absolute;top:52px;left:8%;right:8%;height:1px;
  background:linear-gradient(90deg,transparent,var(--line),var(--line),transparent);z-index:0}
.step{position:relative;z-index:1;text-align:center;padding:24px 16px;border-radius:var(--r);
  background:var(--panel);border:1px solid var(--line-soft);transition:.45s var(--ease)}
.step:hover{transform:translateY(-8px);border-color:var(--gold-400)}
.step__n{width:62px;height:62px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--display);font-size:1.35rem;background:var(--bg);border:1px solid var(--line);
  color:var(--gold-300);transition:.45s var(--spring)}
.step:hover .step__n{background:linear-gradient(135deg,var(--gold-600),var(--gold-300));
  color:#150F04;border-color:transparent;transform:scale(1.12) rotate(-8deg)}
.step h4{font-family:var(--sans);font-size:1rem;margin:0 0 6px}
.step p{font-size:.86rem;color:var(--muted);margin:0}
@media (max-width:900px){.steps{grid-template-columns:1fr 1fr}.steps::before{display:none}}
@media (max-width:520px){.steps{grid-template-columns:1fr}}

/* ================= syllabus ================= */
.syl{display:grid;gap:11px}
.syl__i{display:flex;gap:18px;align-items:flex-start;padding:19px 20px;border-radius:var(--r);
  background:var(--panel);border:1px solid var(--line-soft);transition:.4s var(--ease)}
.syl__i:hover{border-color:var(--gold-400);transform:translateX(6px)}
.syl__n{font-family:var(--display);font-weight:500;font-size:1.5rem;color:var(--gold-400);line-height:1;
  min-width:30px;flex:none}
.syl__i b{display:block;font-size:1rem;margin-bottom:4px}
.syl__i p{font-size:.86rem;color:var(--muted);margin:0}

/* ================= demo cards ================= */
.demo3{position:relative;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line-soft);
  background:var(--panel);text-align:left;width:100%;transition:.5s var(--ease);
  transform-style:preserve-3d}
.demo3:hover{border-color:var(--gold-400);box-shadow:0 30px 66px rgba(0,0,0,.5)}
.demo3__t{aspect-ratio:16/9;position:relative;overflow:hidden;
  background:radial-gradient(circle at 50% 45%,var(--navy-700),var(--navy-950))}
.demo3__t::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 55%,rgba(5,11,24,.85))}
.demo3__p{position:absolute;left:50%;top:50%;translate:-50% -50%;z-index:2;width:62px;height:62px;
  border-radius:50%;display:grid;place-items:center;font-size:19px;padding-left:4px;
  background:linear-gradient(135deg,var(--gold-600),var(--gold-300));color:#150F04;
  transition:.45s var(--spring)}
.demo3:hover .demo3__p{transform:translate(-50%,-50%) scale(1.16)}
.demo3__t img{position:absolute;left:50%;top:50%;translate:-50% -50%;width:42%;opacity:.15}
.demo3__b{padding:20px}
.demo3__b h4{font-family:var(--sans);font-size:1.02rem;margin:0 0 6px}
.demo3__badge{position:absolute;top:12px;left:12px;z-index:3}

/* ================= misc ================= */
.chip{font-family:var(--mono);font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;
  padding:5px 10px;border-radius:99px;border:1px solid var(--line-soft);color:var(--muted);
  display:inline-block}
.chip--live{border-color:var(--bad);color:var(--bad)}
.chip--done{border-color:var(--ok);color:var(--ok)}
.chip--gold{border-color:var(--gold-500);color:var(--gold-300)}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-soft);
  border:1px solid var(--line-soft);border-radius:var(--r-lg);overflow:hidden}
.strip > div{background:var(--bg);padding:clamp(20px,2.6vw,32px);text-align:center;transition:background-color .4s}
.strip > div:hover{background:var(--panel)}
.strip b{display:block;font-family:var(--display);font-weight:500;font-size:clamp(2.2rem,3.8vw,3.1rem);
  color:var(--gold-300);line-height:1}
.strip > div > span{font-family:var(--mono);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin-top:10px;display:block}
@media (max-width:780px){.strip{grid-template-columns:1fr 1fr}}
.note{background:var(--panel);border:1px solid var(--line-soft);border-left:3px solid var(--gold-500);
  border-radius:12px;padding:18px 20px;font-size:.9rem;color:var(--muted)}
.note b{color:var(--text)}
.crumb{font-family:var(--mono);font-size:.72rem;color:var(--muted);letter-spacing:.06em;margin-bottom:16px}
.sprog{position:fixed;top:0;left:0;height:2px;width:0;z-index:700;
  background:linear-gradient(90deg,var(--gold-600),var(--gold-300))}
.feat{display:flex;gap:15px;align-items:flex-start;padding:19px;border-radius:var(--r);
  background:var(--panel);border:1px solid var(--line-soft);transition:.42s var(--ease)}
.feat:hover{border-color:var(--gold-400);transform:translateY(-4px)}
.feat__i{width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;
  font-size:17px;background:var(--panel-2);transition:.42s var(--spring)}
.feat:hover .feat__i{background:linear-gradient(135deg,var(--gold-600),var(--gold-300));
  color:#150F04;transform:rotate(-9deg) scale(1.08)}
.feat b{font-size:.95rem;display:block;margin-bottom:3px}
.feat p{font-size:.85rem;color:var(--muted);margin:0}

/* ================= forms ================= */
.fld{margin-bottom:20px}
.fld label{display:block;font-size:.85rem;font-weight:500;margin-bottom:7px}
.fld .rq{color:var(--gold-400)}
.fld input,.fld select,.fld textarea{width:100%;padding:13px 15px;background:var(--panel);
  color:var(--text);border:1px solid var(--line-soft);border-radius:11px;font-size:.94rem;
  transition:border-color .25s,box-shadow .25s}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--gold-400);
  box-shadow:0 0 0 3px rgba(224,169,76,.13)}
.fld textarea{min-height:110px;resize:vertical}
.fld.bad input,.fld.bad select{border-color:var(--bad)}
.fld .er{display:none;color:var(--bad);font-size:.76rem;margin-top:5px}
.fld.bad .er{display:block}
.hp{position:absolute;left:-9999px}
.okp{display:none;text-align:center;padding:46px 26px;border:1px solid var(--ok);
  border-radius:var(--r-lg);background:rgba(66,176,124,.07)}
.okp.show{display:block;animation:pop .5s var(--spring)}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
.okp .tick{width:62px;height:62px;border-radius:50%;background:var(--ok);color:#fff;
  display:grid;place-items:center;margin:0 auto 18px;font-size:26px}
.sending{opacity:.6;pointer-events:none}

/* ================= accordion ================= */
.acc details{border-bottom:1px solid var(--line-soft)}
.acc summary{padding:20px 0;cursor:pointer;font-weight:500;list-style:none;
  display:flex;justify-content:space-between;gap:20px;align-items:center;font-size:1rem}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"";width:9px;height:9px;border:1px solid var(--gold-400);
  transform:rotate(45deg);flex:none;transition:.35s var(--ease)}
.acc details[open] summary::after{background:var(--gold-500);transform:rotate(225deg)}
.acc .body{padding-bottom:22px;color:var(--muted);font-size:.92rem}

/* ================= dock / bot ================= */
.dock{position:fixed;right:20px;bottom:20px;z-index:600;display:flex;flex-direction:column;
  align-items:flex-end;gap:11px}
.dock__b{width:42px;height:42px;border-radius:50%;background:var(--panel);
  border:1px solid var(--line-soft);display:grid;place-items:center;
  backdrop-filter:blur(10px);transition:.3s var(--ease);position:relative}
.dock__b:hover{border-color:var(--gold-400);color:var(--gold-300);transform:translateY(-2px)}
.dock__b svg{width:17px;height:17px}
/* sound button: animated equaliser when on, muted glyph when off */
.eq{display:flex;align-items:flex-end;gap:2.5px;height:15px}
.eq i{width:2.5px;background:currentColor;border-radius:2px;height:4px;transition:height .2s}
.dock__b.snd-on{color:var(--gold-300);border-color:var(--gold-400)}
.dock__b.snd-on .eq i{animation:eqb .9s ease-in-out infinite}
.dock__b.snd-on .eq i:nth-child(2){animation-delay:.15s}
.dock__b.snd-on .eq i:nth-child(3){animation-delay:.3s}
.dock__b.snd-on .eq i:nth-child(4){animation-delay:.45s}
@keyframes eqb{0%,100%{height:4px}50%{height:14px}}
.dock__b--snd svg{width:21px;height:21px}
.dock__b--snd .wv{opacity:0;transform-origin:12px 12px;transition:opacity .3s var(--ease)}
.dock__b--snd .slash2{opacity:1;transition:opacity .3s var(--ease),stroke-dashoffset .4s var(--ease);
  stroke-dasharray:24;stroke-dashoffset:0}
.dock__b.snd-on .slash2{opacity:0;stroke-dashoffset:24}
.dock__b.snd-on .wv1{opacity:1;animation:wv 1.5s ease-in-out infinite}
.dock__b.snd-on .wv2{opacity:1;animation:wv 1.5s ease-in-out .25s infinite}
@keyframes wv{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:1;transform:scale(1.06)}}
.dock__b--snd::after{content:"";position:absolute;inset:-4px;border-radius:50%;
  border:1px solid var(--gold-400);opacity:0;transform:scale(.85);transition:.4s var(--ease)}
.dock__b.snd-on.dock__b--snd::after{opacity:.5;transform:scale(1);animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{opacity:.55;transform:scale(.9)}70%{opacity:0;transform:scale(1.35)}100%{opacity:0}}
.dock__ai{width:60px;height:60px;border-radius:50%;position:relative;
  background:linear-gradient(135deg,var(--gold-600),var(--gold-300));color:#0B1730;
  display:grid;place-items:center;box-shadow:0 10px 34px rgba(192,138,52,.42);
  transition:.35s var(--spring)}
.dock__ai:hover{transform:scale(1.08) rotate(6deg)}
.dock__ai span{position:absolute;top:-2px;right:-2px;width:13px;height:13px;border-radius:50%;
  background:var(--ok);border:2px solid var(--bg)}

.bot{position:fixed;right:20px;bottom:94px;z-index:601;width:min(392px,calc(100vw - 40px));
  height:min(580px,74svh);border-radius:22px;overflow:hidden;display:none;flex-direction:column;
  background:color-mix(in srgb,var(--navy-800) 92%,transparent);backdrop-filter:blur(26px);
  border:1px solid var(--line);box-shadow:0 30px 90px rgba(0,0,0,.6)}
[data-theme="light"] .bot,[data-theme="focus"] .bot{background:var(--bg)}
.bot.open{display:flex;animation:pop .35s var(--ease)}
.bot__h{display:flex;align-items:center;gap:11px;padding:14px 16px;
  border-bottom:1px solid var(--line-soft);flex:none}
.bot__h img{height:32px}
.bot__h b{font-family:var(--display);font-weight:500;font-size:.98rem;display:block}
.bot__h small{color:var(--ok);font-size:.68rem;font-family:var(--mono)}
.bot__b{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:88%;padding:11px 15px;border-radius:16px;font-size:.9rem;line-height:1.55;
  animation:bin .35s var(--ease)}
@keyframes bin{from{opacity:0;transform:translateY(9px)}}
.bub--b{background:var(--panel-2);border-bottom-left-radius:5px;align-self:flex-start}
.bub--u{background:linear-gradient(135deg,var(--gold-600),var(--gold-300));color:#150F04;
  border-bottom-right-radius:5px;align-self:flex-end}
.bub a{color:var(--gold-300);text-decoration:underline}
.bub--b b{color:var(--gold-300)}
.bot__o{display:flex;flex-wrap:wrap;gap:7px;padding:0 16px 10px;flex:none}
.bot__o button{border:1px solid var(--gold-500);color:var(--gold-300);border-radius:99px;
  padding:8px 14px;font-size:.77rem;transition:.25s}
.bot__o button:hover{background:var(--gold-500);color:#150F04}
.bot__in{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line-soft);flex:none}
.bot__in input{flex:1;padding:11px 14px;border-radius:99px;background:var(--panel-2);
  border:1px solid var(--line-soft);color:var(--text);font-size:.88rem}
.bot__in input:focus{outline:0;border-color:var(--gold-400)}
.bot__in button{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--gold-600),var(--gold-300));color:#150F04;
  transition:transform .2s var(--spring)}
.bot__in button:hover{transform:scale(1.08)}
.dots{display:flex;gap:4px;padding:13px 15px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bl 1.2s infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}

/* ================= modal ================= */
.modal{position:fixed;inset:0;z-index:800;background:rgba(3,7,16,.9);backdrop-filter:blur(8px);
  display:none;place-items:center;padding:20px}
.modal.open{display:grid;animation:pop .3s var(--ease)}
.modal__in{width:100%;max-width:880px;background:var(--navy-800);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:clamp(24px,3vw,40px);max-height:88svh;overflow-y:auto;position:relative}
[data-theme="light"] .modal__in,[data-theme="focus"] .modal__in{background:var(--bg)}
.modal__x{position:absolute;top:16px;right:20px;font-size:26px;line-height:1}
.vframe{position:relative;aspect-ratio:16/9;border-radius:var(--r-lg);overflow:hidden;
  border:1px solid var(--line);display:grid;place-items:center;
  background:radial-gradient(circle at 50% 40%,var(--navy-700),var(--navy-950))}
.vplay{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;font-size:24px;
  padding-left:5px;background:linear-gradient(135deg,var(--gold-600),var(--gold-300));color:#0B1730}

/* ================= login / portal ================= */
.login{min-height:100svh;display:grid;place-items:center;padding:110px 20px 60px}
.login__c{width:100%;max-width:445px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:clamp(28px,4vw,44px);backdrop-filter:blur(14px)}
.login__c img{height:74px;margin:0 auto 22px}
@keyframes shk{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.shake{animation:shk .5s}

/* ================= lectures ================= */
.lechead{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-end}
.bar{height:7px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--gold-600),var(--gold-300));transition:width 1.2s var(--ease)}
.modtitle{display:flex;align-items:center;gap:16px;margin:54px 0 22px}
.modtitle h3{margin:0;white-space:nowrap}
.modtitle i{flex:1;height:1px;background:var(--line-soft)}
.modtitle span{font-family:var(--mono);font-size:.68rem;color:var(--muted);letter-spacing:.12em}
.lecgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:16px}
.lec{text-align:left;background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:20px;position:relative;overflow:hidden;width:100%;transform-style:preserve-3d;
  transition:transform .4s var(--ease),border-color .3s,box-shadow .4s}
.lec:hover{border-color:var(--line);box-shadow:0 20px 46px rgba(0,0,0,.4)}
.lec::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(280px circle at var(--mx,50%) var(--my,50%),rgba(224,169,76,.11),transparent 45%);
  opacity:0;transition:opacity .4s}
.lec:hover::after{opacity:1}
.lec__top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.lec__ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  background:var(--panel-2);font-size:17px;flex:none;transition:.35s var(--ease)}
.lec:hover .lec__ico{background:linear-gradient(135deg,var(--gold-600),var(--gold-300));color:#150F04}
.lec h4{font-family:var(--sans);font-size:1rem;font-weight:600;margin:0 0 8px;line-height:1.35}
.lec__meta{display:flex;gap:9px;align-items:center;font-family:var(--mono);font-size:.7rem;
  color:var(--muted);letter-spacing:.04em}
.lec--live{border-color:rgba(208,87,75,.32)}
.lec__go{margin-top:14px;font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--gold-400);opacity:0;transform:translateY(8px);
  transition:.4s var(--ease)}
.lec:hover .lec__go,.lec:focus-visible .lec__go{opacity:1;transform:none}
.ring{width:44px;height:44px;flex:none;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3}
.ring .bgc{stroke:var(--line-soft)}
.ring .fgc{stroke:var(--gold-400);stroke-linecap:round;transition:stroke-dashoffset 1s var(--ease)}
.ring span{font-family:var(--mono);font-size:.6rem;color:var(--gold-300)}

/* ================= footer ================= */
.ftr{border-top:1px solid var(--line-soft);padding-block:clamp(56px,7vw,90px) 34px;margin-top:60px}
.ftr__g{display:grid;grid-template-columns:1.7fr 1fr 1fr 1fr;gap:38px}
.ftr h4{font-family:var(--mono);font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--gold-400);margin-bottom:18px}
.ftr a{display:block;font-size:.9rem;color:var(--muted);padding:6px 0;transition:color .25s,transform .25s}
.ftr a:hover{color:var(--gold-300);transform:translateX(4px)}
.ftr img{height:88px;margin-bottom:16px}
.ftr__b{margin-top:50px;padding-top:26px;border-top:1px solid var(--line-soft);display:flex;
  justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}

[data-rv]{opacity:0;transform:translateY(30px);
  transition:opacity .85s var(--ease),transform .85s var(--ease);
  transition-delay:calc(var(--d,0)*90ms)}
[data-rv].in{opacity:1;transform:none}
.toast{position:fixed;left:50%;bottom:26px;translate:-50% 0;z-index:900;background:var(--navy-800);
  border:1px solid var(--line);border-radius:99px;padding:12px 22px;font-size:.86rem;
  opacity:0;pointer-events:none;transition:.4s var(--ease)}
.toast.show{opacity:1;transform:translateY(-6px)}

/* ================= responsive ================= */
@media (max-width:1080px){
  .hero__g{grid-template-columns:1fr;gap:40px}
  .stage{max-width:400px;order:-1}
  .hero{min-height:auto;padding-top:118px}
  .c3,.c4,.c5{grid-column:span 6}
  .c7,.c8{grid-column:span 12}
  .ftr__g{grid-template-columns:1fr 1fr}
}
@media (max-width:900px){
  .nav,.hdr__cta{display:none}
  .burger{display:flex}
  .mob{display:block}
  .cue{display:none}
}
@media (max-width:680px){
  body{font-size:16px}
  .c3,.c4,.c5,.c6,.c7,.c8{grid-column:span 12}
  .ftr__g{grid-template-columns:1fr}
  .bot{right:12px;left:12px;width:auto;bottom:84px;height:min(500px,66svh)}
  .dock{right:14px;bottom:14px}
  .flip--course{height:400px}
  /* readability: nothing informative drops below 0.84rem on a phone */
  .tile p,.feat p,.step p,.syl__i p,.demo3__b p,.note,.acc .body{font-size:.9rem}
  .chip{font-size:.72rem}
  .strip > div > span,.hero__m > div > span,.tile__k,.aff > span{font-size:.76rem}
  .lec__meta{font-size:.74rem}
  .flip__list{font-size:.88rem}
  .eyebrow{font-size:.68rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important}
  [data-rv]{opacity:1;transform:none}
  .wi{transform:none}
  .orb,.pl__o,.pl__sun{animation:none}
}
@media print{.hdr,.ftr,.dock,.bot,.stage,#stars,.aura,#pre{display:none!important}}

/* ---- counter spans always inherit their container's type ---- */
.hero__m b [data-count], .strip b [data-count], .tile b [data-count]{
  font:inherit;color:inherit;letter-spacing:inherit;text-transform:none;
  display:inline;margin:0}

/* ---- native <select> dropdowns: render dark instead of white ---- */
:root{color-scheme:dark}
[data-theme="light"],[data-theme="focus"]{color-scheme:light}
.fld select{
  appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--gold-400) 50%),
                   linear-gradient(135deg,var(--gold-400) 50%,transparent 50%);
  background-position:calc(100% - 19px) calc(50% + 2px),calc(100% - 13px) calc(50% + 2px);
  background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:42px;cursor:pointer}
.fld select option{background:var(--navy-800);color:var(--text);padding:10px}
[data-theme="light"] .fld select option,[data-theme="focus"] .fld select option{
  background:#fff;color:#0B1730}

/* ---- flip cards: content now fills the face instead of leaving dead space ---- */
.flip--course{height:430px}
.flip__f > p{flex:0 0 auto}
.flip__chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.flip__list--2col{grid-template-columns:1fr 1fr;column-gap:16px;gap:5px;font-size:.84rem}
@media (max-width:520px){
  .flip--course{height:410px}
  .flip__list--2col{grid-template-columns:1fr}
}

/* front face watermark — fills the lower area intentionally instead of
   leaving the dead space the taller card would otherwise show */
.flip__wm{position:absolute;right:-18px;bottom:-26px;width:158px;opacity:.055;
  pointer-events:none;transition:transform .8s var(--ease),opacity .5s}
.flip:hover .flip__wm{transform:translate(-8px,-8px) rotate(-6deg);opacity:.09}
@media (max-width:520px){.flip--course{height:452px}.flip__wm{width:120px}}


/* ---------- corner prompts ---------- */
.nag{position:fixed;z-index:400;width:min(320px,calc(100vw - 32px));
  background:color-mix(in srgb,var(--navy-800) 96%,transparent);backdrop-filter:blur(18px);
  border:1px solid var(--line);border-radius:16px;padding:18px 18px 16px;
  box-shadow:0 22px 60px rgba(0,0,0,.4);
  opacity:0;transform:translateY(14px) scale(.97);pointer-events:none;
  transition:opacity .45s var(--ease),transform .45s var(--ease)}
[data-theme="light"] .nag{background:#fff;box-shadow:0 22px 60px rgba(20,30,50,.16)}
.nag.on{opacity:1;transform:none;pointer-events:auto}
.nag--left{left:20px;bottom:20px}
.nag--right{right:20px;bottom:96px}
.nag h4{font-family:var(--display);font-weight:500;font-size:1.02rem;margin:0 0 6px;padding-right:22px}
.nag p{font-size:.86rem;color:var(--muted);margin:0 0 14px}
.nag ul{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:6px;font-size:.84rem;color:var(--muted)}
.nag li{display:flex;gap:8px;align-items:flex-start}
.nag li::before{content:"";width:5px;height:5px;background:var(--gold-500);
  transform:rotate(45deg);margin-top:7px;flex:none}
.nag .btn{width:100%}
.nag__x{position:absolute;top:12px;right:14px;font-size:20px;line-height:1;color:var(--muted);
  width:26px;height:26px;border-radius:7px}
.nag__x:hover{background:var(--panel-2);color:var(--text)}
@media (max-width:860px){.nag{display:none}}

/* preloader follows the theme */
[data-theme="light"] .pl__p{box-shadow:0 0 12px rgba(192,138,52,.7)}
[data-theme="light"] .pl__x{color:var(--gold-600)}
[data-theme="focus"] #pre{background:#fff}
[data-theme="focus"] .pl__o,[data-theme="focus"] .pl__p{border-color:#7A5312;background:#7A5312}

/* ---------- past papers ---------- */
.tabs2{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line-soft);padding-bottom:2px}
.tabs2 button{padding:11px 20px;font-size:.88rem;font-weight:500;color:var(--muted);
  border-bottom:2px solid transparent;transition:.25s var(--ease)}
.tabs2 button:hover{color:var(--text)}
.tabs2 button.on{color:var(--gold-300);border-bottom-color:var(--gold-500)}
.plist{display:grid;gap:9px}
.prow{display:grid;grid-template-columns:38px 1fr auto;gap:14px;align-items:center;
  padding:15px 18px;border-radius:12px;background:var(--panel);border:1px solid var(--line-soft);
  transition:.32s var(--ease)}
.prow:hover{border-color:var(--gold-400);transform:translateX(5px);
  box-shadow:0 10px 30px rgba(0,0,0,.14)}
.prow__n{font-family:var(--display);font-weight:500;font-size:1.2rem;color:var(--gold-400);text-align:center}
.prow__t{font-size:.95rem;font-weight:600}
.prow__s{font-family:var(--mono);font-size:.7rem;color:var(--muted);letter-spacing:.05em;margin-top:2px}
.plinks{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.plink{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;
  padding:7px 12px;border-radius:8px;border:1px solid var(--line-soft);color:var(--muted);
  white-space:nowrap;transition:.25s var(--ease)}
.plink:hover{border-color:var(--gold-400);color:var(--gold-300);background:var(--panel-2)}
.plink--ms{border-style:dashed}
.plink--ms::after{content:" 🔒";font-size:.8em}
.plink--ms.open{border-style:solid}
.plink--ms.open::after{content:""}
@media(max-width:700px){
  .prow{grid-template-columns:32px 1fr;gap:10px}
  .plinks{grid-column:1 / -1;justify-content:flex-start;margin-top:4px}
}
.yrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.yr{padding:16px;border-radius:12px;background:var(--panel);border:1px solid var(--line-soft);
  text-align:center;transition:.32s var(--ease)}
.yr:hover{border-color:var(--gold-400);transform:translateY(-4px);
  box-shadow:0 14px 34px rgba(0,0,0,.16)}
.yr b{display:block;font-family:var(--display);font-weight:500;font-size:1.35rem}
.yr span{font-family:var(--mono);font-size:.68rem;color:var(--muted);letter-spacing:.09em}

/* review avatars */
.rev__by{display:flex;align-items:center;gap:12px;margin-top:16px}
.rev__pic{width:44px;height:44px;border-radius:50%;flex:none;object-fit:cover;
  border:1px solid var(--line)}
.rev__pic--ph{display:grid;place-items:center;font-family:var(--display);font-size:1.15rem;
  color:var(--gold-300);background:var(--panel-2)}

/* extra hover feedback */
.syl__i:hover .syl__n{color:var(--gold-300);transform:scale(1.14)}
.syl__n{transition:.35s var(--spring)}
.strip > div{transition:background-color .4s,transform .4s var(--ease)}
.strip > div:hover{transform:translateY(-4px)}
.strip > div:hover b{color:var(--gold-400)}
.strip b{transition:color .35s}
.acc summary{transition:color .25s,padding-left .3s var(--ease)}
.acc summary:hover{color:var(--gold-300);padding-left:6px}
.ftr h4{transition:letter-spacing .4s var(--ease)}
.ftr > .wrap > .ftr__g > div:hover h4{letter-spacing:.26em}
.nag:hover{border-color:var(--gold-400)}
.logo img{transition:transform .5s var(--spring)}
.logo:hover img{transform:rotate(-8deg) scale(1.08)}
.hero__m > div{transition:transform .4s var(--ease)}
.hero__m > div:hover{transform:translateY(-4px)}
.hero__m > div:hover b{color:var(--gold-400)}
.hero__m b{transition:color .35s}
.chip{transition:border-color .3s,color .3s}
.tile:hover .tile__n{color:var(--gold-400)}
.tile__n{transition:color .4s}

.sylgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:11px}
.sylc{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:13px;
  background:var(--panel);border:1px solid var(--line-soft);transition:.34s var(--ease)}
.sylc:hover{border-color:var(--gold-400);transform:translateY(-4px);
  box-shadow:0 14px 34px rgba(0,0,0,.13)}
.sylc__n{font-family:var(--display);font-weight:500;font-size:1.15rem;color:var(--gold-400);min-width:24px;
  transition:.35s var(--spring)}
.sylc:hover .sylc__n{transform:scale(1.16);color:var(--gold-300)}
.sylc b{display:block;font-size:.93rem;line-height:1.35}
.sylc span{font-family:var(--mono);font-size:.68rem;color:var(--muted);letter-spacing:.05em}

.tile .revstars{color:var(--gold-400);letter-spacing:3px;font-size:.9rem}
.revverif{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:.62rem;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ok);margin-top:8px}
.revverif::before{content:"\2713";font-size:.8rem}


/* ---------- paper viewer ---------- */
.pdfv{position:fixed;inset:0;z-index:900;background:var(--bg);display:none;
  flex-direction:column;height:100svh;max-height:100svh;overflow:hidden}
.pdfv.open{display:flex}
.pdfv__bar{display:flex;align-items:center;gap:12px;padding:11px 16px;flex:none;
  border-bottom:1px solid var(--line-soft);background:var(--panel)}
.pdfv__t{flex:1;min-width:0}
.pdfv__t b{display:block;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pdfv__t span{font-size:.68rem;color:var(--muted)}
.pdfv__acts{display:flex;gap:7px;flex:none}
.pdfv__body{flex:1;display:flex;min-height:0;overflow:hidden;background:var(--navy-900)}
[data-theme="light"] .pdfv__body{background:#E7DFD3}
.pane{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--line-soft)}
.pane:last-child{border-right:0}
.pane--b{display:none}
.pdfv.split .pane--b{display:flex}
.pane__h{display:none;align-items:center;gap:10px;padding:8px 14px;flex:none;
  background:var(--panel);border-bottom:1px solid var(--line-soft);font-size:.8rem}
.pdfv.split .pane__h{display:flex}
.pane__h b{flex:1;font-size:.8rem}
.pane__x{font-size:20px;line-height:1;color:var(--muted)}
.pane__s{flex:1 1 0;min-height:0;height:100%;overflow-y:scroll;overflow-x:hidden;padding:14px;
  display:block;text-align:center;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
.pane__s > *{flex:none;margin:0 auto 12px;display:block}
.pane__s canvas{max-width:100%;height:auto;border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.28);
  background:#fff}
.pdfload{display:grid;place-items:center;gap:11px;padding:40px 20px;text-align:center;color:var(--text)}
.pdfload .spin2{width:32px;height:32px;border:3px solid var(--line-soft);
  border-top-color:var(--gold-400);border-radius:50%;animation:sp2 .8s linear infinite}
@keyframes sp2{to{transform:rotate(360deg)}}
.pdfload .bar{width:min(260px,66vw);height:4px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.pdfload .bar i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--gold-600),var(--gold-300));transition:width .25s linear}
/* portrait phones: stack the two papers instead of squeezing them side by side */
@media(max-width:820px){
  .pdfv__body{flex-direction:column}
  .pane__s{-webkit-overflow-scrolling:touch}
  .pdfv.split .pane__s{max-height:none}
  .pane{border-right:0;border-bottom:1px solid var(--line-soft)}
  .pdfv.split .pane{flex:1 1 50%;min-height:0}
  .pane__s{padding:10px;gap:9px}
  .pdfv__bar{padding:9px 12px;gap:8px}
  .pdfv__acts .btn{padding:.5em .75em;font-size:.72rem}
}
/* ---------- mobile: smaller cards that actually fit ---------- */
@media(max-width:760px){
  .prow{grid-template-columns:30px 1fr;gap:9px;padding:12px 13px;border-radius:11px}
  .prow__n{font-size:.95rem}
  .prow__t{font-size:.88rem;line-height:1.35}
  .prow__s{font-size:.66rem}
  .plinks{grid-column:1/-1;justify-content:flex-start;gap:6px;margin-top:6px}
  .plink{padding:6px 10px;font-size:.64rem}
  .yrgrid{grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px}
  .yr{padding:12px 8px}
  .yr b{font-size:1.1rem}
  .yr span{font-size:.62rem}
  .sylgrid{grid-template-columns:1fr;gap:8px}
  .sylc{padding:13px 15px}
  .sylc b{font-size:.89rem}
  .tile{padding:20px 18px;border-radius:16px}
  .tile__n{font-size:2.2rem}
  .ccard{padding:20px 18px}
  .aff{padding:14px 10px}
  .aff__logo,.aff__logo img{height:56px;max-height:56px}
  .strip{grid-template-columns:1fr 1fr}
  .strip>div{padding:16px 10px}
  .strip b{font-size:1.7rem}
  .lec2{padding:12px 13px;gap:11px}
  .lec2__p{width:32px;height:32px;font-size:11px}
  .lec2__t b{font-size:.88rem}
  .topic__h{padding:14px 16px;gap:12px}
  .topic__n{width:32px;height:32px;font-size:.92rem}
  .flip--course{height:auto;min-height:360px}
  .sec{padding-block:52px}
  h2{font-size:clamp(1.5rem,6vw,2rem)}
}
@media(max-width:420px){
  .strip{grid-template-columns:1fr 1fr;gap:1px}
  .yrgrid{grid-template-columns:1fr 1fr}
  .plink{font-size:.62rem;padding:5px 9px}
}

.plink{background:none;border:1px solid var(--line-soft);cursor:pointer;font-family:var(--mono);
  display:inline-block;line-height:1.2}
button.plink:hover{border-color:var(--gold-400);color:var(--gold-300);background:var(--panel-2)}

/* ================= COMPACT LAYOUT ================= */
.affg2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.aff--wide{display:flex;align-items:center;gap:16px;text-align:left;padding:16px 18px}
.aff--wide .aff__logo{height:52px;width:64px;margin:0;flex:none}
.aff--wide .aff__logo img{max-height:52px}
.aff--wide b{font-size:.98rem}
.aff--wide span{margin-top:3px}

.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mini__c{padding:16px 18px;border-radius:13px;background:var(--panel);
  border:1px solid var(--line-soft);transition:.3s var(--ease);display:block}
.mini__c:hover{border-color:var(--gold-400);transform:translateY(-3px)}
.mini__c b{display:block;font-size:.95rem}
.mini__c span{font-family:var(--mono);font-size:.68rem;color:var(--muted);letter-spacing:.05em}
.mini__c--go{background:linear-gradient(135deg,rgba(192,138,52,.16),transparent);
  border-color:var(--gold-500)}
.mini__c--go b{color:var(--gold-300)}

.tlist{display:flex;flex-wrap:wrap;gap:7px}
.tpill{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:9px;
  background:var(--panel);border:1px solid var(--line-soft);font-size:.86rem;
  transition:.25s var(--ease)}
.tpill:hover{border-color:var(--gold-400);transform:translateY(-2px)}
.tpill i{font-family:var(--mono);font-style:normal;font-size:.7rem;color:var(--gold-400)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.two__c{display:block;padding:24px;border-radius:18px;background:var(--panel);
  border:1px solid var(--line-soft);transition:.35s var(--ease)}
.two__c:hover{border-color:var(--gold-400);transform:translateY(-5px);
  box-shadow:0 20px 46px rgba(0,0,0,.16)}
.two__c b{display:block;font-family:var(--display);font-weight:500;font-size:1.35rem;margin:12px 0 6px}
.two__c p{font-size:.9rem;color:var(--muted);margin:0 0 12px}
.two__c ul{list-style:none;padding:0;margin:0;display:grid;gap:6px;font-size:.86rem;color:var(--muted)}
.two__c li{display:flex;gap:8px}
.two__c li::before{content:"";width:5px;height:5px;background:var(--gold-500);
  transform:rotate(45deg);margin-top:7px;flex:none}
.two__go{display:block;margin-top:16px;font-family:var(--mono);font-size:.72rem;
  letter-spacing:.1em;text-transform:uppercase;color:var(--gold-400)}
.two__c--gold{border-color:var(--gold-500)}

.ftr__l a,.ftr__c a{padding:4px 0;font-size:.86rem}
.ftr__b{margin-top:26px;padding-top:16px;font-size:.78rem}

/* ---------- reviews: one continuously scrolling row ---------- */
.rrail{overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
.rrail__t{display:flex;gap:14px;width:max-content;animation:rrail 42s linear infinite}
.rrail:hover .rrail__t,.rrail:active .rrail__t{animation-play-state:paused}
@keyframes rrail{to{transform:translateX(-50%)}}
.rcard{flex:none;width:min(340px,80vw);margin:0;padding:20px 22px;border-radius:16px;
  background:var(--panel);border:1px solid var(--line-soft);display:flex;flex-direction:column;
  transition:border-color .3s var(--ease)}
.rcard:hover{border-color:var(--gold-400)}
.rcard__s{color:var(--gold-400);letter-spacing:2px;font-size:.82rem;margin-bottom:9px}
.rcard blockquote{margin:0 0 14px;font-size:.9rem;line-height:1.55;color:var(--muted);flex:1}
.rcard figcaption{display:flex;align-items:center;gap:11px}
.rcard figcaption b{font-size:.88rem;display:block}
.rcard__r{font-family:var(--mono);font-size:.74rem;color:var(--gold-400);letter-spacing:.06em}

<script>
/* theme + sound, same as the rest of the site */
(function () {
  var $ = function (q) { return document.querySelector(q); };
  var FINE = matchMedia('(hover:hover) and (pointer:fine)').matches;
  var AC = null, snd = false;
  function ac() { return (AC = AC || new (window.AudioContext || window.webkitAudioContext)()); }
  function tone(f, d, t, v) {
    if (!snd) return;
    try { var c = ac(); if (c.state === 'suspended') c.resume();
      var o = c.createOscillator(), g = c.createGain();
      o.type = t || 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(v || .12, c.currentTime);
      g.gain.exponentialRampToValueAtTime(.0001, c.currentTime + (d || .08));
      o.connect(g).connect(c.destination); o.start(); o.stop(c.currentTime + (d || .08));
    } catch (e) { }
  }
  var sfx = {
    hover: function () { tone(540, .05, 'sine', .05); },
    click: function () { tone(680, .06, 'triangle', .12); setTimeout(function () { tone(900, .07, 'triangle', .08); }, 40); },
    toggle: function () { tone(880, .05, 'square', .05); setTimeout(function () { tone(1180, .06, 'square', .04); }, 45); },
    tab: function () { tone(720, .05, 'triangle', .07); }
  };
  window.SMKsfx = sfx;
  var sB = $('[data-sound]');
  sB.addEventListener('click', function () {
    snd = !snd; sB.classList.toggle('snd-on', snd); sB.setAttribute('aria-pressed', snd);
    if (snd) { if (ac().resume) ac().resume(); sfx.toggle(); }
    toast(snd ? 'Sound on' : 'Sound off');
  });
  var lh = 0;
  document.addEventListener('mouseenter', function (e) {
    if (!FINE || !e.target.closest || Date.now() - lh < 90) return;
    if (e.target.closest('a,button')) { sfx.hover(); lh = Date.now(); }
  }, true);
  document.addEventListener('click', function (e) {
    if (!e.target.closest) return;
    if (e.target.closest('[data-theme-btn],[data-sound]')) sfx.toggle();
    else if (e.target.closest('.pick__m button')) sfx.tab();
    else if (e.target.closest('a,button')) sfx.click();
  });
  var TH = ['light', 'dark', 'focus'], ti = 0, tB = $('[data-theme-btn]');
  var TI = {
    dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
    light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    focus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h7a3 3 0 0 1 3 3v11a2.5 2.5 0 0 0-2.5-2.5H3z"/><path d="M21 5h-7a3 3 0 0 0-3 3v11a2.5 2.5 0 0 1 2.5-2.5H21z"/></svg>'
  };
  tB.innerHTML = TI.light;
  tB.addEventListener('click', function () {
    ti = (ti + 1) % TH.length; var t = TH[ti];
    document.documentElement.setAttribute('data-theme', t);
    tB.innerHTML = TI[t];
    toast(t === 'focus' ? 'Focus mode' : t === 'light' ? 'Light theme' : 'Dark theme');
  });
  var tt;
  function toast(m) {
    var el = document.querySelector('.toast');
    if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
    el.textContent = m; el.classList.add('show');
    clearTimeout(tt); tt = setTimeout(function () { el.classList.remove('show'); }, 2400);
  }
  window.SMKtoast = toast;
})();
</script>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
/* ==========================================================================
   THE PLAYER
   Only a lecture id arrives in the address bar. The video comes back from the
   database, and only if this browser is allowed it.
   ========================================================================== */
(function () {
  var $ = function (q) { return document.querySelector(q); };
  var C = window.SMK_CONFIG;
  var LEC = new URLSearchParams(location.search).get('id') || '';
  var LEVELNAME = { O: 'O Level / IGCSE', AS: 'AS Level', A2: 'A2 Level' };
  var YT = null, DATA = null, ready = false, tick = null, dur = 0;

  function student() {
    try { var p = JSON.parse(localStorage.getItem('smk_premium')); if (p && p.sid) return p; }
    catch (e) { } return null;
  }
  function device() { return localStorage.getItem('smk_device_key'); }

  function fail(title, body) {
    $('#ph').style.display = 'grid';
    $('#ph').innerHTML = '<div style="max-width:40ch"><div style="font-size:30px">&#128274;</div>' +
      '<b style="font-family:var(--display);font-size:1.15rem;display:block;margin-top:10px">' + title +
      '</b><p class="muted" style="font-size:.86rem;margin-top:8px">' + body + '</p></div>';
    $('#ctl').style.display = 'none';
    $('#bigPlay').classList.add('hide');
  }

  /* ---------- ask the database for this lecture ---------- */
  async function load() {
    if (!LEC) { fail('No lecture chosen', 'Open a lecture from the main page.'); return; }
    var s = student();
    try {
      var r = await fetch(C.SUPABASE_URL + '/rest/v1/rpc/get_lecture', {
        method: 'POST',
        headers: { apikey: C.SUPABASE_ANON_KEY, Authorization: 'Bearer ' + C.SUPABASE_ANON_KEY,
                   'Content-Type': 'application/json' },
        body: JSON.stringify({ p_lecture: LEC, p_id: s ? s.sid : null, p_device: device() })
      });
      DATA = await r.json();
    } catch (e) {
      fail('Could not reach the server', 'Check your connection and try again.');
      return;
    }

    if (!DATA || !DATA.ok) {
      var why = {
        no_lecture: ['Lecture not found', 'It may have been removed. Go back and pick another.'],
        locked: ['This lecture is locked', 'Sign in with your student ID on the main page to open every lecture in your level.'],
        no_student: ['Signed out', 'Sign in again on the main page.'],
        paused: ['Account paused', 'Message 0302 8056789 to have it reopened.'],
        wrong_level: ['Not your level', 'You are enrolled in a different syllabus.'],
        device_removed: ['This device was signed out', 'Sign in again on the main page.']
      }[(DATA && DATA.reason) || ''] || ['Cannot open this lecture', 'Go back and try again.'];
      fail(why[0], why[1]);
      return;
    }

    var d = DATA;
    document.title = d.title + ' \u2014 Sir Mehboob Khan';
    $('#barT').textContent = d.title;
    $('#barS').textContent = LEVELNAME[d.lvl] + ' \u00b7 Topic ' + d.topic + ' \u00b7 Lecture ' + d.n;
    $('#lecT').textContent = d.title;
    $('#chip').textContent = 'Lecture ' + d.n + (d.duration ? ' \u00b7 ' + d.duration : '');
    $('#lecS').textContent = LEVELNAME[d.lvl] + ' \u00b7 Topic ' + d.topic;

    if (d.notes_url && !d.free) {
      var nb = $('#bNotes');
      nb.href = /^https?:/i.test(d.notes_url) ? d.notes_url
        : 'https://raw.githubusercontent.com/hashirykw/SMK/main/' + d.notes_url;
      nb.style.display = '';
    }

    $('#traceNote').innerHTML = d.student_id
      ? '<b>Your student ID is on this video.</b> It moves across the whole frame while you ' +
        'watch. Any recording that leaves this account can be traced straight back to it, and ' +
        'the ID is banned.'
      : '<b>This is a preview lecture.</b> The opening lecture of the first four topics plays ' +
        'without an account. <a href="index.html#portal" style="color:var(--gold-300)">Sign in</a> ' +
        'to open the rest of ' + LEVELNAME[d.lvl] + '.';

    if (!d.video_url) {
      fail('Video not linked yet', 'This lecture has no video on it yet. Ask Sir Mehboob to add one.');
      return;
    }
    watermark(d.student_id ? (d.student_id.toUpperCase() + '  \u00b7  ' + (d.name || ''))
                           : 'PREVIEW \u00b7 PHYSICSWITHSMK.COM');
    startVideo(d.video_url);
  }

  /* ---------- a YouTube id, however it was pasted in ---------- */
  function ytId(v) {
    v = String(v || '').trim();
    var m = v.match(/(?:youtu\.be\/|v=|\/embed\/|\/shorts\/|\/live\/)([A-Za-z0-9_-]{11})/);
    if (m) return m[1];
    if (/^[A-Za-z0-9_-]{11}$/.test(v)) return v;          // the bare id
    return null;
  }

  function startVideo(url) {
    var id = ytId(url);
    if (!id) { fail('Video link not understood', 'It should be a YouTube link or an 11-character video id.'); return; }
    $('#ph').style.display = 'none';
    $('#bigPlay').classList.remove('hide');
    function go() {
      YT = new window.YT.Player('ytbox', {
        videoId: id,
        host: 'https://www.youtube-nocookie.com',
        playerVars: {
          controls: 0, modestbranding: 1, rel: 0, showinfo: 0, iv_load_policy: 3,
          fs: 0, disablekb: 1, playsinline: 1, origin: location.origin
        },
        events: {
          onReady: function () { ready = true; $('#ctl').style.display = ''; wire(); },
          onStateChange: onState,
          onError: function () { fail('This video will not play', 'It may be private or removed. Unlisted is the setting that works.'); }
        }
      });
    }
    if (window.YT && window.YT.Player) go();
    else window.onYouTubeIframeAPIReady = go;
  }

  /* ---------- the watermark, drifting over the whole frame ---------- */
  function watermark(label) {
    var host = $('#stage');
    ['wm', 'wm wm--b'].forEach(function (cls, i) {
      var el = document.createElement('div');
      el.className = cls; el.textContent = label;
      el.style.left = '0'; el.style.top = '0';
      host.appendChild(el);
      var t = i * 7000;                       // the two never sit together
      function step() {
        var w = host.clientWidth, h = host.clientHeight;
        var ew = el.offsetWidth || 160, eh = el.offsetHeight || 16;
        var x = Math.random() * Math.max(0, w - ew);
        var y = Math.random() * Math.max(0, h - eh);
        var secs = 9 + Math.random() * 5;
        el.style.transition = 'transform ' + secs + 's linear, opacity 1.2s ease';
        el.style.transform = 'translate(' + x + 'px,' + y + 'px)';
        el.style.opacity = i ? .55 : .9;
        setTimeout(step, secs * 1000);
      }
      setTimeout(step, t);
    });
  }

  /* ---------- controls ---------- */
  function fmt(s) {
    s = Math.max(0, Math.floor(s || 0));
    var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0');
  }
  function flash(sym) {
    var f = $('#flash'); f.innerHTML = sym;
    f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
  }
  function playing() { return ready && YT.getPlayerState && YT.getPlayerState() === 1; }
  function toggle() {
    if (!ready) return;
    if (playing()) { YT.pauseVideo(); flash('&#10073;&#10073;'); }
    else { YT.playVideo(); flash('&#9654;'); }
  }
  function onState(e) {
    var PLAY = '<polygon points="6 4 20 12 6 20 6 4"></polygon>';
    var PAUSE = '<path d="M8 4v16M16 4v16"/>';
    $('#iPlay').innerHTML = e.data === 1 ? PAUSE : PLAY;
    $('#bigPlay').classList.toggle('hide', e.data === 1 || e.data === 3);
    if (e.data === 1) {
      dur = YT.getDuration() || 0;
      if (!tick) tick = setInterval(paint, 250);
      $('#stage').classList.remove('show');
    } else {
      $('#stage').classList.add('show');
    }
    if (e.data === 0) { clearInterval(tick); tick = null; }
  }
  function paint() {
    if (!ready) return;
    var t = YT.getCurrentTime() || 0;
    dur = dur || YT.getDuration() || 0;
    var p = dur ? (t / dur) * 100 : 0;
    $('#sFill').style.width = p + '%'; $('#sKnob').style.left = p + '%';
    $('#sBuf').style.width = ((YT.getVideoLoadedFraction() || 0) * 100) + '%';
    $('#tTime').textContent = fmt(t) + ' / ' + fmt(dur);
    var k = 'smk_pos_' + LEC;
    if (playing()) localStorage.setItem(k, String(t));
  }

  function wire() {
    dur = YT.getDuration() || 0;
    paint();
    $('#bPlay').addEventListener('click', toggle);
    $('#bigPlay').addEventListener('click', toggle);
    $('#shield').addEventListener('click', toggle);
    $('#shield').addEventListener('contextmenu', function (e) { e.preventDefault(); });

    function nudge(s) {
      YT.seekTo(Math.max(0, (YT.getCurrentTime() || 0) + s), true);
      flash(s > 0 ? '&#8631; 10' : '&#8630; 10'); paint();
    }
    $('#bBack').addEventListener('click', function () { nudge(-10); });
    $('#bFwd').addEventListener('click', function () { nudge(10); });

    var seek = $('#seek'), drag = false;
    function at(x) { var r = seek.getBoundingClientRect(); return Math.min(1, Math.max(0, (x - r.left) / r.width)); }
    seek.addEventListener('pointerdown', function (e) {
      drag = true; seek.classList.add('drag'); seek.setPointerCapture(e.pointerId);
      if (dur) { YT.seekTo(at(e.clientX) * dur, true); paint(); }
    });
    seek.addEventListener('pointermove', function (e) {
      var f = at(e.clientX);
      $('#sTip').style.left = (f * 100) + '%'; $('#sTip').textContent = fmt(f * dur);
      if (drag && dur) { YT.seekTo(f * dur, true); paint(); }
    });
    addEventListener('pointerup', function () { drag = false; seek.classList.remove('drag'); });

    var rVol = $('#rVol'), last = 100;
    rVol.addEventListener('input', function () {
      YT.setVolume(+rVol.value);
      if (+rVol.value === 0) YT.mute(); else { YT.unMute(); last = +rVol.value; }
    });
    $('#bMute').addEventListener('click', function () {
      if (YT.isMuted()) { YT.unMute(); YT.setVolume(last); rVol.value = last; flash('&#128266;'); }
      else { YT.mute(); rVol.value = 0; flash('&#128263;'); }
    });

    var SP = [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];
    function drawSp() {
      var cur = YT.getPlaybackRate();
      $('#mSpeed').innerHTML = SP.map(function (v) {
        return '<button data-sp="' + v + '" class="' + (cur === v ? 'on' : '') + '"><span>' +
          (v === 1 ? 'Normal' : v + '\u00d7') + '</span></button>';
      }).join('');
    }
    drawSp();
    $('#mSpeed').addEventListener('click', function (e) {
      var b = e.target.closest('[data-sp]'); if (!b) return;
      YT.setPlaybackRate(+b.dataset.sp); drawSp(); $('#mSpeed').classList.remove('on');
      window.SMKtoast(+b.dataset.sp === 1 ? 'Normal speed' : 'Speed ' + b.dataset.sp + '\u00d7');
    });

    function drawQ() {
      var levels = (YT.getAvailableQualityLevels && YT.getAvailableQualityLevels()) || [];
      var names = { hd1080: '1080p', hd720: '720p', large: '480p', medium: '360p',
                    small: '240p', tiny: '144p', auto: 'Auto' };
      var cur = YT.getPlaybackQuality && YT.getPlaybackQuality();
      var rows = '<button data-q="default" class="' + (cur === 'auto' ? 'on' : '') + '"><span>Auto</span></button>';
      levels.forEach(function (q) {
        if (q === 'auto') return;
        rows += '<button data-q="' + q + '" class="' + (cur === q ? 'on' : '') + '"><span>' +
          (names[q] || q) + '</span></button>';
      });
      $('#mCC').innerHTML = rows || '<button disabled style="opacity:.55"><span>Auto</span></button>';
    }
    drawQ();
    $('#mCC').addEventListener('click', function (e) {
      var b = e.target.closest('[data-q]'); if (!b) return;
      YT.setPlaybackQuality(b.dataset.q); drawQ(); $('#mCC').classList.remove('on');
      window.SMKtoast('Quality set');
    });

    function menu(btn, m) {
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var was = m.classList.contains('on');
        document.querySelectorAll('.pick__m').forEach(function (x) { x.classList.remove('on'); });
        if (!was) { m.classList.add('on'); if (m.id === 'mCC') drawQ(); }
      });
    }
    menu($('#bSpeed'), $('#mSpeed'));
    menu($('#bCC'), $('#mCC'));
    document.addEventListener('click', function () {
      document.querySelectorAll('.pick__m').forEach(function (x) { x.classList.remove('on'); });
    });

    $('#bFull').addEventListener('click', function () {
      if (document.fullscreenElement) document.exitFullscreen();
      else if ($('#stage').requestFullscreen) $('#stage').requestFullscreen();
    });
    document.addEventListener('fullscreenchange', function () {
      $('#stage').classList.toggle('full', !!document.fullscreenElement);
    });

    var hide;
    $('#stage').addEventListener('pointermove', function () {
      $('#stage').classList.add('show'); clearTimeout(hide);
      hide = setTimeout(function () { if (playing()) $('#stage').classList.remove('show'); }, 2600);
    });

    addEventListener('keydown', function (e) {
      if (e.target.matches('input,textarea,select')) return;
      var k = e.key;
      if (k === ' ' || k === 'k') { e.preventDefault(); toggle(); }
      else if (k === 'ArrowRight' || k === 'l') { e.preventDefault(); nudge(10); }
      else if (k === 'ArrowLeft' || k === 'j') { e.preventDefault(); nudge(-10); }
      else if (k === 'ArrowUp') { e.preventDefault(); rVol.value = Math.min(100, +rVol.value + 10); rVol.dispatchEvent(new Event('input')); }
      else if (k === 'ArrowDown') { e.preventDefault(); rVol.value = Math.max(0, +rVol.value - 10); rVol.dispatchEvent(new Event('input')); }
      else if (k === 'm') $('#bMute').click();
      else if (k === 'f') $('#bFull').click();
      else if (k === '>' || k === '.') { var i = SP.indexOf(YT.getPlaybackRate()); YT.setPlaybackRate(SP[Math.min(SP.length - 1, i + 1)]); drawSp(); window.SMKtoast('Speed ' + YT.getPlaybackRate() + '\u00d7'); }
      else if (k === '<' || k === ',') { var j = SP.indexOf(YT.getPlaybackRate()); YT.setPlaybackRate(SP[Math.max(0, j - 1)]); drawSp(); window.SMKtoast('Speed ' + YT.getPlaybackRate() + '\u00d7'); }
      else if (/^[0-9]$/.test(k) && dur) YT.seekTo(dur * (+k / 10), true);
    });

    /* pick up where they stopped */
    var at2 = parseFloat(localStorage.getItem('smk_pos_' + LEC) || '0');
    if (at2 > 10 && dur && at2 < dur - 15) {
      YT.seekTo(at2, true); paint();
      window.SMKtoast('Picking up at ' + fmt(at2));
    }
  }

  $('#btnClose').addEventListener('click', function () {
    if (window.opener && !window.opener.closed) window.close();
    else location.href = 'index.html#portal';
  });

  /* keep checking they are still allowed to be here */
  setInterval(async function () {
    var s = student(); if (!s || !DATA || DATA.free) return;
    try {
      var r = await fetch(C.SUPABASE_URL + '/rest/v1/rpc/verify_student', {
        method: 'POST',
        headers: { apikey: C.SUPABASE_ANON_KEY, Authorization: 'Bearer ' + C.SUPABASE_ANON_KEY,
                   'Content-Type': 'application/json' },
        body: JSON.stringify({ p_id: s.sid, p_device: device() })
      });
      var d = await r.json();
      if (d && d.ok === true) return;
      if (!d || ['no_student', 'paused', 'device_removed'].indexOf(d.reason) === -1) return;
      ['smk_premium', 'smk_premium_id', 'smk_course'].forEach(function (k) { localStorage.removeItem(k); });
      if (ready) YT.pauseVideo();
      fail('Signed out', 'This account is no longer active on this device.');
    } catch (e) { }
  }, 60000);

  load();
})();
</script>
