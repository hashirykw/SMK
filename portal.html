<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Student Portal — Sir Mehboob Khan</title>
<meta name="description" content="Student login for enrolled Cambridge Physics students.">
<meta name="view-transition" content="same-origin">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">
<meta name="theme-color" content="#050B18">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter+Tight:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   SIR MEHBOOB KHAN — v3
   Type: Fraunces (display) · Inter Tight (UI) · Space Mono (labels)
   ========================================================================== */

:root{
  --navy-950:#050B18; --navy-900:#081226; --navy-800:#0E1B36;
  --navy-700:#16294B; --navy-600:#1F3A66;
  --gold-600:#A8752A; --gold-500:#C08A34; --gold-400:#D49C42;
  --gold-300:#E0A94C; --gold-100:#F2DDB4;
  --ice:#7FA8E8; --paper:#FAF8F4; --ink:#F3EEE3; --dim:#98A2B8;
  --ok:#42B07C; --bad:#D0574B;

  --bg:var(--navy-950);
  --panel:rgba(255,255,255,.032);
  --panel-2:rgba(255,255,255,.055);
  --line:rgba(224,169,76,.17);
  --line-soft:rgba(255,255,255,.09);
  --text:var(--ink); --muted:var(--dim);

  --display:"Fraunces",Georgia,serif;
  --sans:"Inter Tight","Inter",system-ui,sans-serif;
  --mono:"Space Mono",ui-monospace,monospace;

  --r:14px; --r-lg:22px; --max:1300px;
  --ease:cubic-bezier(.22,.8,.32,1);
  --spring:cubic-bezier(.34,1.4,.64,1);
}
[data-theme="light"]{
  --bg:var(--paper); --panel:rgba(8,18,38,.04); --panel-2:rgba(8,18,38,.07);
  --line:rgba(168,117,42,.3); --line-soft:rgba(8,18,38,.11);
  --text:#0B1730; --muted:#54607A; --navy-800:#fff; --navy-900:#F2EDE3;
}
[data-theme="focus"]{
  --bg:#fff; --panel:#fff; --panel-2:#F1F1F1; --line:#000; --line-soft:#000;
  --text:#000; --muted:#262626; --navy-800:#fff; --navy-900:#fff;
  --gold-500:#7A5312; --gold-400:#7A5312; --gold-300:#7A5312;
}
[data-theme="focus"] *{animation:none!important;transition:none!important}
[data-theme="focus"] .orb,[data-theme="focus"] #stars,[data-theme="focus"] .cur,
[data-theme="focus"] .cur-d,[data-theme="focus"] .aura{display:none!important}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:92px}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
  font-size:16.5px;line-height:1.62;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.lock{overflow:hidden}
img{max-width:100%;display:block;height:auto}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;line-height:1.07;
  letter-spacing:-.024em;margin:0 0 .5em}
h1{font-size:clamp(2.5rem,6.6vw,5.4rem)}
h2{font-size:clamp(1.95rem,4.1vw,3.15rem)}
h3{font-size:clamp(1.2rem,2vw,1.5rem)}
p{margin:0 0 1rem;max-width:64ch}
:focus-visible{outline:2px solid var(--gold-300);outline-offset:3px;border-radius:6px}
::selection{background:var(--gold-500);color:#12203C}

/* ---- custom scrollbar ---- */
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--navy-900)}
[data-theme="light"] ::-webkit-scrollbar-track{background:#EDE7DA}
::-webkit-scrollbar-thumb{border-radius:99px;border:3px solid transparent;
  background-clip:content-box;background-color:var(--gold-600)}
::-webkit-scrollbar-thumb:hover{background-color:var(--gold-400)}
html{scrollbar-width:thin;scrollbar-color:var(--gold-600) var(--navy-900)}

.wrap{width:100%;max-width:var(--max);margin-inline:auto;padding-inline:clamp(18px,4vw,40px)}
.sec{padding-block:clamp(74px,9vw,150px);position:relative}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:var(--mono);
  font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold-400);margin-bottom:20px}
.eyebrow::before{content:"";width:6px;height:6px;background:var(--gold-500);transform:rotate(45deg)}
.lede{font-size:clamp(1rem,1.4vw,1.16rem);color:var(--muted);max-width:56ch}

/* ================= PRELOADER — orbital mechanics ================= */
#pre{position:fixed;inset:0;z-index:9999;background:var(--navy-950);display:grid;
  place-items:center;transition:opacity .8s var(--ease),visibility .8s}
#pre.gone{opacity:0;visibility:hidden;pointer-events:none}
.pl{display:grid;place-items:center;gap:0}
.pl__sys{position:relative;width:min(230px,54vw);aspect-ratio:1/1;display:grid;place-items:center}
.pl__sun{width:38%;z-index:3;filter:drop-shadow(0 0 32px rgba(224,169,76,.55));
  animation:plsun 3s ease-in-out infinite}
@keyframes plsun{50%{transform:scale(1.06)}}
.pl__o{position:absolute;border:1px solid rgba(224,169,76,.24);border-radius:50%;
  transform-style:preserve-3d}
.pl__o:nth-of-type(1){inset:22%;animation:plo 3.4s linear infinite}
.pl__o:nth-of-type(2){inset:9%;animation:plo 5.6s linear infinite reverse}
.pl__o:nth-of-type(3){inset:-4%;animation:plo 8.2s linear infinite}
@keyframes plo{to{transform:rotate(360deg)}}
.pl__p{position:absolute;border-radius:50%;background:var(--gold-300);
  box-shadow:0 0 14px var(--gold-400)}
.pl__o:nth-of-type(1) .pl__p{width:7px;height:7px;top:-4px;left:calc(50% - 3.5px)}
.pl__o:nth-of-type(2) .pl__p{width:9px;height:9px;top:calc(50% - 4.5px);right:-5px;
  background:var(--ice);box-shadow:0 0 14px var(--ice)}
.pl__o:nth-of-type(3) .pl__p{width:5px;height:5px;bottom:-3px;left:calc(50% - 2.5px)}
.pl__t{width:min(250px,56vw);height:2px;background:rgba(255,255,255,.09);
  margin-top:36px;border-radius:9px;overflow:hidden}
.pl__b{height:100%;width:0;background:linear-gradient(90deg,var(--gold-600),var(--gold-300));
  transition:width .3s linear}
.pl__x{margin-top:15px;font-family:var(--mono);font-size:.63rem;letter-spacing:.28em;
  color:var(--gold-400);text-transform:uppercase;min-height:1em}

/* ================= cursor / starfield ================= */
.cur,.cur-d{position:fixed;top:0;left:0;pointer-events:none;z-index:9000;
  border-radius:50%;translate:-50% -50%}
.cur{width:34px;height:34px;border:1px solid var(--gold-400);
  transition:width .25s var(--ease),height .25s var(--ease),background-color .25s}
.cur.on{width:66px;height:66px;background:rgba(192,138,52,.1)}
.cur-d{width:5px;height:5px;background:var(--gold-300)}
@media (hover:none),(pointer:coarse){.cur,.cur-d{display:none}}
#stars{position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.55}
.aura{position:fixed;width:70vmax;height:70vmax;border-radius:50%;z-index:-1;
  pointer-events:none;top:-26vmax;right:-18vmax;filter:blur(20px);
  background:radial-gradient(circle,rgba(192,138,52,.1),transparent 62%)}

/* ================= header ================= */
.hdr{position:fixed;top:0;left:0;right:0;z-index:500;border-bottom:1px solid transparent;
  transition:transform .45s var(--ease),background-color .35s,backdrop-filter .35s,border-color .35s}
.hdr.stuck{background:color-mix(in srgb,var(--bg) 80%,transparent);
  backdrop-filter:blur(18px) saturate(1.4);border-bottom-color:var(--line-soft)}
.hdr.hide{transform:translateY(-105%)}
.hdr__in{display:flex;align-items:center;gap:26px;min-height:78px;max-width:var(--max);
  margin-inline:auto;padding-inline:clamp(18px,4vw,40px)}
.logo{display:flex;align-items:center;gap:11px;flex:none}
.logo img{height:40px}
.logo b{font-family:var(--display);font-size:.95rem;letter-spacing:.03em;line-height:1.1;white-space:nowrap}
.logo b i{color:var(--gold-400);font-style:normal}
.nav{display:flex;gap:25px;margin-left:auto;align-items:center}
.nav a{font-size:.87rem;font-weight:500;position:relative;padding:5px 0;white-space:nowrap}
.nav a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:0;
  background:var(--gold-400);transition:width .3s var(--ease)}
.nav a:hover::after,.nav a.on::after{width:100%}
.nav a.on{color:var(--gold-300)}
.hdr__cta{display:flex;gap:10px;align-items:center;margin-left:16px}

/* burger + COMPACT dropdown (no more full-screen takeover) */
.burger{display:none;width:46px;height:46px;margin-left:auto;flex-direction:column;
  align-items:center;justify-content:center;gap:5px;border:1px solid var(--line-soft);
  border-radius:12px;background:var(--panel)}
.burger i{width:19px;height:1.6px;background:var(--text);transition:.35s var(--ease);display:block}
.burger.x i:nth-child(1){transform:translateY(6.6px) rotate(45deg)}
.burger.x i:nth-child(2){opacity:0}
.burger.x i:nth-child(3){transform:translateY(-6.6px) rotate(-45deg)}
.mob{position:fixed;top:74px;left:12px;right:12px;z-index:490;display:none;
  background:color-mix(in srgb,var(--navy-800) 96%,transparent);backdrop-filter:blur(24px);
  border:1px solid var(--line);border-radius:20px;padding:10px;
  box-shadow:0 26px 70px rgba(0,0,0,.55);
  max-height:calc(100svh - 100px);overflow-y:auto;
  opacity:0;transform:translateY(-12px) scale(.98);transform-origin:top center;
  transition:opacity .28s var(--ease),transform .28s var(--ease),visibility .28s;visibility:hidden}
[data-theme="light"] .mob,[data-theme="focus"] .mob{background:var(--bg)}
.mob.open{opacity:1;transform:none;visibility:visible}
.mob a{display:flex;align-items:center;justify-content:space-between;gap:12px;
  font-size:.98rem;font-weight:500;padding:13px 15px;border-radius:12px;transition:background-color .2s}
.mob a:hover,.mob a:focus-visible{background:var(--panel-2)}
.mob a span{font-family:var(--mono);font-size:.62rem;color:var(--muted);letter-spacing:.1em}
.mob__sep{height:1px;background:var(--line-soft);margin:8px 6px}
.mob__row{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px}
.mob__row .btn{width:100%}

/* ================= buttons ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55em;
  padding:.94em 1.7em;border-radius:11px;font-size:.87rem;font-weight:600;
  position:relative;overflow:hidden;
  transition:transform .18s var(--spring),box-shadow .3s var(--ease),
    border-color .3s var(--ease),background-color .3s}
.btn:active{transform:scale(.96)}
.btn--gold{background:linear-gradient(135deg,var(--gold-600),var(--gold-300));color:#150F04;
  box-shadow:0 6px 26px rgba(192,138,52,.3);
  clip-path:polygon(0 0,calc(100% - 13px) 0,100% 13px,100% 100%,0 100%)}
.btn--gold:hover{box-shadow:0 12px 42px rgba(192,138,52,.48)}
.btn--gold::after{content:"";position:absolute;inset:0;
  background:linear-gradient(105deg,transparent 32%,rgba(255,248,232,.6) 50%,transparent 68%);
  transform:translateX(-130%);transition:transform .55s var(--ease)}
.btn--gold:hover::after{transform:translateX(130%)}
.btn--line{border:1px solid var(--line);color:var(--text);background:var(--panel)}
.btn--line:hover{border-color:var(--gold-400);background:var(--panel-2)}
.btn--sm{padding:.64em 1.15em;font-size:.78rem}
.btn--wide{width:100%}

/* ================= hero ================= */
.hero{min-height:100svh;display:flex;align-items:center;position:relative;
  padding-top:104px;padding-bottom:64px;overflow:hidden}
.hero__g{display:grid;grid-template-columns:1.02fr .98fr;gap:clamp(28px,4vw,58px);
  align-items:center;width:100%}
.w{display:inline-block;overflow:hidden;vertical-align:bottom}
.wi{display:inline-block;transform:translateY(112%);transition:transform .95s var(--ease)}
.ready .wi{transform:none}
.grad{background:linear-gradient(105deg,var(--gold-300),var(--gold-100) 45%,var(--gold-500));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hero__cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:34px}
.hero__m{display:flex;gap:clamp(22px,4vw,50px);margin-top:50px;flex-wrap:wrap}
.hero__m b{display:block;font-family:var(--display);
  font-size:clamp(2.2rem,3.4vw,2.9rem);color:var(--gold-300);line-height:1}
.hero__m > div > span{display:block;font-family:var(--mono);font-size:.78rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);margin-top:8px}
.cue{position:absolute;bottom:24px;left:50%;translate:-50% 0;display:grid;justify-items:center;
  gap:8px;font-family:var(--mono);font-size:.6rem;letter-spacing:.25em;color:var(--muted);
  text-transform:uppercase}
.cue i{width:1px;height:40px;background:linear-gradient(var(--gold-400),transparent);
  animation:cue 2s ease-in-out infinite}
@keyframes cue{50%{opacity:.25;transform:scaleY(.6)}}
.stage{position:relative;aspect-ratio:1/1;width:100%;max-width:620px;margin-inline:auto}
.stage canvas{position:absolute;inset:0;width:100%!important;height:100%!important;
  opacity:0;transition:opacity 1.1s var(--ease)}
.stage canvas.on{opacity:1}
.stage__fb{position:absolute;inset:0;display:grid;place-items:center;transition:opacity .8s var(--ease)}
.stage.up .stage__fb{opacity:0}
.stage__fb img{width:64%;filter:drop-shadow(0 30px 70px rgba(192,138,52,.3))}
.orb{position:absolute;border:1px solid var(--gold-500);border-radius:50%;opacity:.4}
.orb:nth-child(1){inset:6%;animation:o1 20s linear infinite}
.orb:nth-child(2){inset:-4%;animation:o2 30s linear infinite;opacity:.22}
.orb:nth-child(3){inset:-14%;animation:o3 42s linear infinite;opacity:.12}
@keyframes o1{to{transform:rotateX(73deg) rotateZ(360deg)}}
@keyframes o2{to{transform:rotateX(64deg) rotateY(18deg) rotateZ(-360deg)}}
@keyframes o3{to{transform:rotateX(79deg) rotateY(-12deg) rotateZ(360deg)}}

/* ================= bento / tiles ================= */
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}
.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.tile{background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r-lg);
  padding:clamp(22px,2.6vw,34px);position:relative;overflow:hidden;
  transition:transform .45s var(--ease),border-color .35s,box-shadow .45s var(--ease)}
.tile:hover{border-color:var(--line);box-shadow:0 24px 60px rgba(0,0,0,.4)}
.tile--glare::before{content:"";position:absolute;inset:0;opacity:0;transition:opacity .4s;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(224,169,76,.13),transparent 42%)}
.tile--glare:hover::before{opacity:1}
.tile__n{font-family:var(--display);font-size:clamp(2.6rem,5vw,4.2rem);line-height:.9;
  color:var(--gold-300);letter-spacing:-.03em}
.tile__k{font-family:var(--mono);font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--muted);margin-top:10px;display:block}
.d3{transform-style:preserve-3d;transition:transform .55s var(--ease)}
.d3 > *{transform-style:preserve-3d}
.z1{transform:translateZ(26px)}
@media (hover:none){.z1{transform:none}}
.edge{position:relative;isolation:isolate}
.edge::before{content:"";position:absolute;inset:-1px;border-radius:inherit;z-index:-1;opacity:0;
  background:conic-gradient(from var(--a,0deg),transparent 0 55%,var(--gold-300) 75%,transparent 85%);
  transition:opacity .45s var(--ease)}
.edge:hover::before{opacity:1;animation:spin 3s linear infinite}
@keyframes spin{to{--a:360deg}}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}

/* ================= FLIP (used in many places now) ================= */
.flip{perspective:1600px}
.flip__i{position:relative;width:100%;height:100%;transform-style:preserve-3d;
  transition:transform .82s cubic-bezier(.5,.1,.2,1)}
.flip:hover .flip__i,.flip:focus-within .flip__i,.flip.on .flip__i{transform:rotateY(180deg)}
.flip__f{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r-lg);
  border:1px solid var(--line-soft);padding:clamp(20px,2.3vw,30px);overflow:hidden;
  display:flex;flex-direction:column;background:var(--panel);backdrop-filter:blur(8px)}
.flip__f--b{transform:rotateY(180deg);
  background:color-mix(in srgb,var(--navy-700) 62%,transparent);
  border-color:rgba(224,169,76,.34)}
[data-theme="light"] .flip__f--b,[data-theme="focus"] .flip__f--b{background:var(--panel-2)}
.flip:hover .flip__f{box-shadow:0 34px 80px rgba(0,0,0,.5)}
.flip--course{height:436px}
.flip--sm{height:250px}
.flip__ring{position:absolute;right:-64px;top:-64px;width:200px;height:200px;border-radius:50%;
  border:1px solid var(--line);opacity:.55;transition:transform .9s var(--ease)}
.flip:hover .flip__ring{transform:scale(1.2) rotate(40deg)}
.flip__list{list-style:none;padding:0;margin:12px 0 0;font-size:.86rem;color:var(--muted);
  display:grid;gap:7px;overflow-y:auto;flex:1}
.flip__list li{display:flex;gap:9px;align-items:flex-start}
.flip__list li::before{content:"";width:5px;height:5px;background:var(--gold-500);
  transform:rotate(45deg);margin-top:7px;flex:none}
.flip__hint{margin-top:auto;font-family:var(--mono);font-size:.64rem;letter-spacing:.14em;
  color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:7px}
.flip__hint i{width:14px;height:14px;border:1px solid var(--gold-500);border-radius:3px;
  display:inline-block;animation:nudge 2.4s ease-in-out infinite}
@keyframes nudge{50%{transform:rotateY(180deg)}}

/* ================= AFFILIATIONS ================= */
.affg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.aff{position:relative;border-radius:var(--r-lg);border:1px solid var(--line-soft);
  background:var(--panel);padding:22px 18px;text-align:center;overflow:hidden;
  transition:transform .45s var(--ease),border-color .35s,box-shadow .45s}
.aff:hover{transform:translateY(-7px);border-color:var(--gold-400);
  box-shadow:0 26px 60px rgba(0,0,0,.42)}
.aff__logo{height:74px;display:grid;place-items:center;margin-bottom:14px}
.aff__logo img{max-height:74px;width:auto;object-fit:contain;
  filter:brightness(1.06);transition:transform .45s var(--spring)}
.aff:hover .aff__logo img{transform:scale(1.07)}
.aff b{display:block;font-size:1rem;line-height:1.3}
.aff > span{display:block;font-family:var(--mono);font-size:.72rem;color:var(--muted);
  letter-spacing:.06em;margin-top:6px}
@media (max-width:900px){.affg{grid-template-columns:1fr 1fr}}
@media (max-width:420px){.affg{grid-template-columns:1fr 1fr;gap:10px}
  .aff{padding:16px 10px}.aff__logo,.aff__logo img{height:56px;max-height:56px}}

/* ================= steps ================= */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;position:relative}
.steps::before{content:"";position:absolute;top:52px;left:8%;right:8%;height:1px;
  background:linear-gradient(90deg,transparent,var(--line),var(--line),transparent);z-index:0}
.step{position:relative;z-index:1;text-align:center;padding:24px 16px;border-radius:var(--r);
  background:var(--panel);border:1px solid var(--line-soft);transition:.45s var(--ease)}
.step:hover{transform:translateY(-8px);border-color:var(--gold-400)}
.step__n{width:62px;height:62px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--display);font-size:1.35rem;background:var(--bg);border:1px solid var(--line);
  color:var(--gold-300);transition:.45s var(--spring)}
.step:hover .step__n{background:linear-gradient(135deg,var(--gold-600),var(--gold-300));
  color:#150F04;border-color:transparent;transform:scale(1.12) rotate(-8deg)}
.step h4{font-family:var(--sans);font-size:1rem;margin:0 0 6px}
.step p{font-size:.86rem;color:var(--muted);margin:0}
@media (max-width:900px){.steps{grid-template-columns:1fr 1fr}.steps::before{display:none}}
@media (max-width:520px){.steps{grid-template-columns:1fr}}

/* ================= syllabus ================= */
.syl{display:grid;gap:11px}
.syl__i{display:flex;gap:18px;align-items:flex-start;padding:19px 20px;border-radius:var(--r);
  background:var(--panel);border:1px solid var(--line-soft);transition:.4s var(--ease)}
.syl__i:hover{border-color:var(--gold-400);transform:translateX(6px)}
.syl__n{font-family:var(--display);font-size:1.5rem;color:var(--gold-400);line-height:1;
  min-width:30px;flex:none}
.syl__i b{display:block;font-size:1rem;margin-bottom:4px}
.syl__i p{font-size:.86rem;color:var(--muted);margin:0}

/* ================= demo cards ================= */
.demo3{position:relative;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line-soft);
  background:var(--panel);text-align:left;width:100%;transition:.5s var(--ease);
  transform-style:preserve-3d}
.demo3:hover{border-color:var(--gold-400);box-shadow:0 30px 66px rgba(0,0,0,.5)}
.demo3__t{aspect-ratio:16/9;position:relative;overflow:hidden;
  background:radial-gradient(circle at 50% 45%,var(--navy-700),var(--navy-950))}
.demo3__t::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 55%,rgba(5,11,24,.85))}
.demo3__p{position:absolute;left:50%;top:50%;translate:-50% -50%;z-index:2;width:62px;height:62px;
  border-radius:50%;display:grid;place-items:center;font-size:19px;padding-left:4px;
  background:linear-gradient(135deg,var(--gold-600),var(--gold-300));color:#150F04;
  transition:.45s var(--spring)}
.demo3:hover .demo3__p{transform:translate(-50%,-50%) scale(1.16)}
.demo3__t img{position:absolute;left:50%;top:50%;translate:-50% -50%;width:42%;opacity:.15}
.demo3__b{padding:20px}
.demo3__b h4{font-family:var(--sans);font-size:1.02rem;margin:0 0 6px}
.demo3__badge{position:absolute;top:12px;left:12px;z-index:3}

/* ================= misc ================= */
.chip{font-family:var(--mono);font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;
  padding:5px 10px;border-radius:99px;border:1px solid var(--line-soft);color:var(--muted);
  display:inline-block}
.chip--live{border-color:var(--bad);color:var(--bad)}
.chip--done{border-color:var(--ok);color:var(--ok)}
.chip--gold{border-color:var(--gold-500);color:var(--gold-300)}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line-soft);
  border:1px solid var(--line-soft);border-radius:var(--r-lg);overflow:hidden}
.strip > div{background:var(--bg);padding:clamp(20px,2.6vw,32px);text-align:center;transition:background-color .4s}
.strip > div:hover{background:var(--panel)}
.strip b{display:block;font-family:var(--display);font-size:clamp(2.2rem,3.8vw,3.1rem);
  color:var(--gold-300);line-height:1}
.strip > div > span{font-family:var(--mono);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin-top:10px;display:block}
@media (max-width:780px){.strip{grid-template-columns:1fr 1fr}}
.note{background:var(--panel);border:1px solid var(--line-soft);border-left:3px solid var(--gold-500);
  border-radius:12px;padding:18px 20px;font-size:.9rem;color:var(--muted)}
.note b{color:var(--text)}
.crumb{font-family:var(--mono);font-size:.72rem;color:var(--muted);letter-spacing:.06em;margin-bottom:16px}
.sprog{position:fixed;top:0;left:0;height:2px;width:0;z-index:700;
  background:linear-gradient(90deg,var(--gold-600),var(--gold-300))}
.feat{display:flex;gap:15px;align-items:flex-start;padding:19px;border-radius:var(--r);
  background:var(--panel);border:1px solid var(--line-soft);transition:.42s var(--ease)}
.feat:hover{border-color:var(--gold-400);transform:translateY(-4px)}
.feat__i{width:44px;height:44px;border-radius:12px;flex:none;display:grid;place-items:center;
  font-size:17px;background:var(--panel-2);transition:.42s var(--spring)}
.feat:hover .feat__i{background:linear-gradient(135deg,var(--gold-600),var(--gold-300));
  color:#150F04;transform:rotate(-9deg) scale(1.08)}
.feat b{font-size:.95rem;display:block;margin-bottom:3px}
.feat p{font-size:.85rem;color:var(--muted);margin:0}

/* ================= forms ================= */
.fld{margin-bottom:20px}
.fld label{display:block;font-size:.85rem;font-weight:500;margin-bottom:7px}
.fld .rq{color:var(--gold-400)}
.fld input,.fld select,.fld textarea{width:100%;padding:13px 15px;background:var(--panel);
  color:var(--text);border:1px solid var(--line-soft);border-radius:11px;font-size:.94rem;
  transition:border-color .25s,box-shadow .25s}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--gold-400);
  box-shadow:0 0 0 3px rgba(224,169,76,.13)}
.fld textarea{min-height:110px;resize:vertical}
.fld.bad input,.fld.bad select{border-color:var(--bad)}
.fld .er{display:none;color:var(--bad);font-size:.76rem;margin-top:5px}
.fld.bad .er{display:block}
.hp{position:absolute;left:-9999px}
.okp{display:none;text-align:center;padding:46px 26px;border:1px solid var(--ok);
  border-radius:var(--r-lg);background:rgba(66,176,124,.07)}
.okp.show{display:block;animation:pop .5s var(--spring)}
@keyframes pop{from{opacity:0;transform:scale(.94)}}
.okp .tick{width:62px;height:62px;border-radius:50%;background:var(--ok);color:#fff;
  display:grid;place-items:center;margin:0 auto 18px;font-size:26px}
.sending{opacity:.6;pointer-events:none}

/* ================= accordion ================= */
.acc details{border-bottom:1px solid var(--line-soft)}
.acc summary{padding:20px 0;cursor:pointer;font-weight:500;list-style:none;
  display:flex;justify-content:space-between;gap:20px;align-items:center;font-size:1rem}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"";width:9px;height:9px;border:1px solid var(--gold-400);
  transform:rotate(45deg);flex:none;transition:.35s var(--ease)}
.acc details[open] summary::after{background:var(--gold-500);transform:rotate(225deg)}
.acc .body{padding-bottom:22px;color:var(--muted);font-size:.92rem}

/* ================= dock / bot ================= */
.dock{position:fixed;right:20px;bottom:20px;z-index:600;display:flex;flex-direction:column;
  align-items:flex-end;gap:11px}
.dock__b{width:42px;height:42px;border-radius:50%;background:var(--panel);
  border:1px solid var(--line-soft);display:grid;place-items:center;
  backdrop-filter:blur(10px);transition:.3s var(--ease);position:relative}
.dock__b:hover{border-color:var(--gold-400);color:var(--gold-300);transform:translateY(-2px)}
.dock__b svg{width:17px;height:17px}
/* sound button: animated equaliser when on, muted glyph when off */
.eq{display:flex;align-items:flex-end;gap:2.5px;height:15px}
.eq i{width:2.5px;background:currentColor;border-radius:2px;height:4px;transition:height .2s}
.dock__b.snd-on{color:var(--gold-300);border-color:var(--gold-400)}
.dock__b.snd-on .eq i{animation:eqb .9s ease-in-out infinite}
.dock__b.snd-on .eq i:nth-child(2){animation-delay:.15s}
.dock__b.snd-on .eq i:nth-child(3){animation-delay:.3s}
.dock__b.snd-on .eq i:nth-child(4){animation-delay:.45s}
@keyframes eqb{0%,100%{height:4px}50%{height:14px}}
.dock__b .slash{position:absolute;width:23px;height:1.6px;background:currentColor;
  transform:rotate(-45deg);border-radius:2px;transition:opacity .25s}
.dock__b.snd-on .slash{opacity:0}
.dock__ai{width:60px;height:60px;border-radius:50%;position:relative;
  background:linear-gradient(135deg,var(--gold-600),var(--gold-300));color:#0B1730;
  display:grid;place-items:center;box-shadow:0 10px 34px rgba(192,138,52,.42);
  transition:.35s var(--spring)}
.dock__ai:hover{transform:scale(1.08) rotate(6deg)}
.dock__ai span{position:absolute;top:-2px;right:-2px;width:13px;height:13px;border-radius:50%;
  background:var(--ok);border:2px solid var(--bg)}

.bot{position:fixed;right:20px;bottom:94px;z-index:601;width:min(392px,calc(100vw - 40px));
  height:min(580px,74svh);border-radius:22px;overflow:hidden;display:none;flex-direction:column;
  background:color-mix(in srgb,var(--navy-800) 92%,transparent);backdrop-filter:blur(26px);
  border:1px solid var(--line);box-shadow:0 30px 90px rgba(0,0,0,.6)}
[data-theme="light"] .bot,[data-theme="focus"] .bot{background:var(--bg)}
.bot.open{display:flex;animation:pop .35s var(--ease)}
.bot__h{display:flex;align-items:center;gap:11px;padding:14px 16px;
  border-bottom:1px solid var(--line-soft);flex:none}
.bot__h img{height:32px}
.bot__h b{font-family:var(--display);font-size:.98rem;display:block}
.bot__h small{color:var(--ok);font-size:.68rem;font-family:var(--mono)}
.bot__b{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:88%;padding:11px 15px;border-radius:16px;font-size:.9rem;line-height:1.55;
  animation:bin .35s var(--ease)}
@keyframes bin{from{opacity:0;transform:translateY(9px)}}
.bub--b{background:var(--panel-2);border-bottom-left-radius:5px;align-self:flex-start}
.bub--u{background:linear-gradient(135deg,var(--gold-600),var(--gold-300));color:#150F04;
  border-bottom-right-radius:5px;align-self:flex-end}
.bub a{color:var(--gold-300);text-decoration:underline}
.bub--b b{color:var(--gold-300)}
.bot__o{display:flex;flex-wrap:wrap;gap:7px;padding:0 16px 10px;flex:none}
.bot__o button{border:1px solid var(--gold-500);color:var(--gold-300);border-radius:99px;
  padding:8px 14px;font-size:.77rem;transition:.25s}
.bot__o button:hover{background:var(--gold-500);color:#150F04}
.bot__in{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line-soft);flex:none}
.bot__in input{flex:1;padding:11px 14px;border-radius:99px;background:var(--panel-2);
  border:1px solid var(--line-soft);color:var(--text);font-size:.88rem}
.bot__in input:focus{outline:0;border-color:var(--gold-400)}
.bot__in button{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--gold-600),var(--gold-300));color:#150F04;
  transition:transform .2s var(--spring)}
.bot__in button:hover{transform:scale(1.08)}
.dots{display:flex;gap:4px;padding:13px 15px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bl 1.2s infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}

/* ================= modal ================= */
.modal{position:fixed;inset:0;z-index:800;background:rgba(3,7,16,.9);backdrop-filter:blur(8px);
  display:none;place-items:center;padding:20px}
.modal.open{display:grid;animation:pop .3s var(--ease)}
.modal__in{width:100%;max-width:880px;background:var(--navy-800);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:clamp(24px,3vw,40px);max-height:88svh;overflow-y:auto;position:relative}
[data-theme="light"] .modal__in,[data-theme="focus"] .modal__in{background:var(--bg)}
.modal__x{position:absolute;top:16px;right:20px;font-size:26px;line-height:1}
.vframe{position:relative;aspect-ratio:16/9;border-radius:var(--r-lg);overflow:hidden;
  border:1px solid var(--line);display:grid;place-items:center;
  background:radial-gradient(circle at 50% 40%,var(--navy-700),var(--navy-950))}
.vplay{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;font-size:24px;
  padding-left:5px;background:linear-gradient(135deg,var(--gold-600),var(--gold-300));color:#0B1730}

/* ================= login / portal ================= */
.login{min-height:100svh;display:grid;place-items:center;padding:110px 20px 60px}
.login__c{width:100%;max-width:445px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r-lg);padding:clamp(28px,4vw,44px);backdrop-filter:blur(14px)}
.login__c img{height:74px;margin:0 auto 22px}
@keyframes shk{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
.shake{animation:shk .5s}

/* ================= lectures ================= */
.lechead{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:flex-end}
.bar{height:7px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--gold-600),var(--gold-300));transition:width 1.2s var(--ease)}
.modtitle{display:flex;align-items:center;gap:16px;margin:54px 0 22px}
.modtitle h3{margin:0;white-space:nowrap}
.modtitle i{flex:1;height:1px;background:var(--line-soft)}
.modtitle span{font-family:var(--mono);font-size:.68rem;color:var(--muted);letter-spacing:.12em}
.lecgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:16px}
.lec{text-align:left;background:var(--panel);border:1px solid var(--line-soft);border-radius:var(--r);
  padding:20px;position:relative;overflow:hidden;width:100%;transform-style:preserve-3d;
  transition:transform .4s var(--ease),border-color .3s,box-shadow .4s}
.lec:hover{border-color:var(--line);box-shadow:0 20px 46px rgba(0,0,0,.4)}
.lec::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(280px circle at var(--mx,50%) var(--my,50%),rgba(224,169,76,.11),transparent 45%);
  opacity:0;transition:opacity .4s}
.lec:hover::after{opacity:1}
.lec__top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.lec__ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
  background:var(--panel-2);font-size:17px;flex:none;transition:.35s var(--ease)}
.lec:hover .lec__ico{background:linear-gradient(135deg,var(--gold-600),var(--gold-300));color:#150F04}
.lec h4{font-family:var(--sans);font-size:1rem;font-weight:600;margin:0 0 8px;line-height:1.35}
.lec__meta{display:flex;gap:9px;align-items:center;font-family:var(--mono);font-size:.7rem;
  color:var(--muted);letter-spacing:.04em}
.lec--live{border-color:rgba(208,87,75,.32)}
.lec__go{margin-top:14px;font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--gold-400);opacity:0;transform:translateY(8px);
  transition:.4s var(--ease)}
.lec:hover .lec__go,.lec:focus-visible .lec__go{opacity:1;transform:none}
.ring{width:44px;height:44px;flex:none;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:3}
.ring .bgc{stroke:var(--line-soft)}
.ring .fgc{stroke:var(--gold-400);stroke-linecap:round;transition:stroke-dashoffset 1s var(--ease)}
.ring span{font-family:var(--mono);font-size:.6rem;color:var(--gold-300)}

/* ================= footer ================= */
.ftr{border-top:1px solid var(--line-soft);padding-block:clamp(56px,7vw,90px) 34px;margin-top:60px}
.ftr__g{display:grid;grid-template-columns:1.7fr 1fr 1fr 1fr;gap:38px}
.ftr h4{font-family:var(--mono);font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--gold-400);margin-bottom:18px}
.ftr a{display:block;font-size:.9rem;color:var(--muted);padding:6px 0;transition:color .25s,transform .25s}
.ftr a:hover{color:var(--gold-300);transform:translateX(4px)}
.ftr img{height:88px;margin-bottom:16px}
.ftr__b{margin-top:50px;padding-top:26px;border-top:1px solid var(--line-soft);display:flex;
  justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}

[data-rv]{opacity:0;transform:translateY(30px);
  transition:opacity .85s var(--ease),transform .85s var(--ease);
  transition-delay:calc(var(--d,0)*90ms)}
[data-rv].in{opacity:1;transform:none}
.toast{position:fixed;left:50%;bottom:26px;translate:-50% 0;z-index:900;background:var(--navy-800);
  border:1px solid var(--line);border-radius:99px;padding:12px 22px;font-size:.86rem;
  opacity:0;pointer-events:none;transition:.4s var(--ease)}
.toast.show{opacity:1;transform:translateY(-6px)}

/* ================= responsive ================= */
@media (max-width:1080px){
  .hero__g{grid-template-columns:1fr;gap:40px}
  .stage{max-width:400px;order:-1}
  .hero{min-height:auto;padding-top:118px}
  .c3,.c4,.c5{grid-column:span 6}
  .c7,.c8{grid-column:span 12}
  .ftr__g{grid-template-columns:1fr 1fr}
}
@media (max-width:900px){
  .nav,.hdr__cta{display:none}
  .burger{display:flex}
  .mob{display:block}
  .cue{display:none}
}
@media (max-width:680px){
  body{font-size:16px}
  .c3,.c4,.c5,.c6,.c7,.c8{grid-column:span 12}
  .ftr__g{grid-template-columns:1fr}
  .bot{right:12px;left:12px;width:auto;bottom:84px;height:min(500px,66svh)}
  .dock{right:14px;bottom:14px}
  .flip--course{height:400px}
  /* readability: nothing informative drops below 0.84rem on a phone */
  .tile p,.feat p,.step p,.syl__i p,.demo3__b p,.note,.acc .body{font-size:.9rem}
  .chip{font-size:.72rem}
  .strip > div > span,.hero__m > div > span,.tile__k,.aff > span{font-size:.76rem}
  .lec__meta{font-size:.74rem}
  .flip__list{font-size:.88rem}
  .eyebrow{font-size:.68rem}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important}
  [data-rv]{opacity:1;transform:none}
  .wi{transform:none}
  .orb,.pl__o,.pl__sun{animation:none}
}
@media print{.hdr,.ftr,.dock,.bot,.stage,#stars,.aura,#pre{display:none!important}}


/* ---- counter spans always inherit their container's type ---- */
.hero__m b [data-count], .strip b [data-count], .tile b [data-count]{
  font:inherit;color:inherit;letter-spacing:inherit;text-transform:none;
  display:inline;margin:0}

/* ---- native <select> dropdowns: render dark instead of white ---- */
:root{color-scheme:dark}
[data-theme="light"],[data-theme="focus"]{color-scheme:light}
.fld select{
  appearance:none;-webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--gold-400) 50%),
                   linear-gradient(135deg,var(--gold-400) 50%,transparent 50%);
  background-position:calc(100% - 19px) calc(50% + 2px),calc(100% - 13px) calc(50% + 2px);
  background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:42px;cursor:pointer}
.fld select option{background:var(--navy-800);color:var(--text);padding:10px}
[data-theme="light"] .fld select option,[data-theme="focus"] .fld select option{
  background:#fff;color:#0B1730}

/* ---- flip cards: content now fills the face instead of leaving dead space ---- */
.flip--course{height:430px}
.flip__f > p{flex:0 0 auto}
.flip__chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.flip__list--2col{grid-template-columns:1fr 1fr;column-gap:16px;gap:5px;font-size:.84rem}
@media (max-width:520px){
  .flip--course{height:410px}
  .flip__list--2col{grid-template-columns:1fr}
}


/* front face watermark — fills the lower area intentionally instead of
   leaving the dead space the taller card would otherwise show */
.flip__wm{position:absolute;right:-18px;bottom:-26px;width:158px;opacity:.055;
  pointer-events:none;transition:transform .8s var(--ease),opacity .5s}
.flip:hover .flip__wm{transform:translate(-8px,-8px) rotate(-6deg);opacity:.09}
@media (max-width:520px){.flip--course{height:452px}.flip__wm{width:120px}}

</style>

  @keyframes shk{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}
    30%,50%,70%{transform:translateX(-7px)}40%,60%{transform:translateX(7px)}}
  .shake{animation:shk .5s}
  #loginErr{display:none;color:var(--bad);font-size:.8rem;margin-bottom:16px;

<script>

(function () {

    (function loop() {

  /* ================= HEADER + COMPACT MOBILE NAV ================= */

  addEventListener('scroll', () => {

  if (burger && mob) {

    });

  /* ================= REVEALS + COUNTERS ================= */
  const rio = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('in'); rio.unobserve(e.target); }
  }), { threshold: .1, rootMargin: '0px 0px -50px' });
  $$('[data-rv]').forEach(el => rio.observe(el));

  const cio = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    cio.unobserve(e.target);
    const el = e.target, target = parseFloat(el.dataset.count), suf = el.dataset.suffix || '';
    if (RM) { el.textContent = target + suf; return; }
    const t0 = performance.now(), dur = 1600;
    (function run(now) {
      const pr = Math.min((now - t0) / dur, 1);
      el.textContent = Math.round(target * (1 - Math.pow(1 - pr, 3))) + suf;
      if (pr < 1) requestAnimationFrame(run);
    })(performance.now());
  }), { threshold: .45 });
  $$('[data-count]').forEach(el => cio.observe(el));

  /* ================= TILT / GLARE / MAGNETIC ================= */
  function bind(root) {
    if (!FINE || RM) return;

      if (el.dataset.g) return; el.dataset.g = 1;

      if (el.dataset.t) return; el.dataset.t = 1;
      el.addEventListener('pointermove', e => {
        const r = el.getBoundingClientRect();
        const px = (e.clientX - r.left) / r.width - .5, py = (e.clientY - r.top) / r.height - .5;

      });
      el.addEventListener('pointerleave', () => { el.style.transform = ''; });
    });
    $$('[data-mag]', root).forEach(el => {
      if (el.dataset.m) return; el.dataset.m = 1;
      el.addEventListener('pointermove', e => {
        const r = el.getBoundingClientRect();
        el.style.transform = `translate(${(e.clientX - r.left - r.width / 2) * .25}px,${(e.clientY - r.top - r.height / 2) * .35}px)`;
      });
      el.addEventListener('pointerleave', () => { el.style.transform = ''; });

  window.SMKbind = bind;

  /* ================= FORMS → SUPABASE ================= */
  async function send(payload) {

        C.SUPABASE_URL.indexOf('YOUR-') === 0 || C.SUPABASE_URL.indexOf('http') !== 0) {

        headers: {
          'apikey': C.SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + C.SUPABASE_ANON_KEY,
          'Content-Type': 'application/json',
          'Prefer': 'return=minimal'

  $$('form[data-form]').forEach(f => {

      $$('.fld', f).forEach(fl => {

      const btn = $('button[type=submit]', f);

      const r = await send(payload);
      f.classList.remove('sending');

      i.addEventListener('input', () => {

      }));

  /* ================= SMK ASSISTANT ================= */
  const aiBtn = $('.dock__ai'), bot = $('.bot');
  if (aiBtn && bot && typeof KB !== 'undefined') {
    const body = $('.bot__b'), opts = $('.bot__o'),
          input = $('.bot__in input'), sendBtn = $('.bot__in button');
    let started = false;
    const C = window.CONTACT || {};

    /* ---- text normalisation + fuzzy matching ---- */
    const norm = s => s.toLowerCase()
      .replace(/[^a-z0-9\s']/g, ' ').replace(/\s+/g, ' ').trim();

    const lev = (a, b) => {                       // bounded Levenshtein
      if (Math.abs(a.length - b.length) > 2) return 3;
      const m = a.length, n = b.length;
      let prev = Array.from({ length: n + 1 }, (_, i) => i);
      for (let i = 1; i <= m; i++) {
        const cur = [i];
        for (let j = 1; j <= n; j++) {
          cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1,
            prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
        }
        prev = cur;
      }
      return prev[n];
    };

    const expand = toks => {
      const out = new Set(toks);
      toks.forEach(t => {
        for (const base in SYN) {
          if (t === base || SYN[base].indexOf(t) > -1) {
            out.add(base); SYN[base].forEach(s => out.add(s));
          }
        }
      });
      return out;
    };

    const STOP = new Set(['the','a','an','is','are','am','do','does','did','i','you','my','me','to','of',
      'in','for','and','can','could','would','it','this','that','be','been','with','on','at','so','if',
      'any','some','get','got','give','tell','know','please','plz','want','need','there','have','has',
      'your','yours','about','from','will','shall','may','also','just','sir','ka','ki','ke','hai','kya']);

    // how students actually type
    const SHORT = {ur:'your',u:'you',r:'are',n:'and',wat:'what',wht:'what',hw:'how',
      pls:'please',plz:'please',thx:'thanks',fee:'fee',clas:'class',clases:'classes',
      olevel:'olevel',alevel:'alevel',aslevel:'aslevel'};

    function match(qRaw) {
      const q = norm(qRaw);
      if (!q) return null;
      const toks = q.split(' ').map(t => SHORT[t] || t).filter(t => t && !STOP.has(t));
      if (!toks.length) return null;

      // One GROUP per word the user typed, expanded with its synonyms.
      // Scoring is per-group, so a single word can never count more than once
      // even when it expands into several synonyms that are all keywords.
      const groups = toks.map(t => expand([t]));

      let best = null, bestScore = 0;
      KB.forEach(entry => {
        let score = 0;
        const seenPhrase = new Set();

        entry.k.forEach(kw => {
          const kws = norm(kw);
          if (kws.indexOf(' ') > -1 && q.indexOf(kws) > -1 && !seenPhrase.has(kws)) {
            seenPhrase.add(kws);
            score += 3.4;                                  // whole phrase present
          }
        });

        groups.forEach(g => {
          let bestForWord = 0;
          entry.k.forEach(kw => {
            const kws = norm(kw);
            if (kws.indexOf(' ') > -1) return;             // phrases handled above
            for (const t of g) {
              if (t === kws) { bestForWord = Math.max(bestForWord, 1.8); break; }
              if (t.length >= 7 && kws.length >= 7) {
                const d = lev(t, kws);
                if (d <= 1) { bestForWord = Math.max(bestForWord, 1.6); break; }
                if (d === 2) { bestForWord = Math.max(bestForWord, 0.9); break; }
              }
              if (t.length >= 5 && kws.length >= 5 &&
                  (kws.indexOf(t) === 0 || t.indexOf(kws) === 0)) {
                bestForWord = Math.max(bestForWord, 1.1); break;
              }
            }
          });
          score += bestForWord;                            // at most one hit per word
        });

        if (score > bestScore) { bestScore = score; best = entry; }
      });

      const need = toks.length <= 1 ? 1.2 : 1.35;
      return bestScore >= need ? { entry: best, score: bestScore } : null;
    }
    window.SMKmatch = match;

    /* ---- chat plumbing ---- */
    const say = (t, who) => {
      const d = document.createElement('div');
      d.className = 'bub bub--' + (who || 'b'); d.innerHTML = t;
      body.appendChild(d); body.scrollTop = body.scrollHeight;
    };
    const wait = () => {
      const d = document.createElement('div');
      d.className = 'bub bub--b dots'; d.innerHTML = '<i></i><i></i><i></i>';
      body.appendChild(d); body.scrollTop = body.scrollHeight; return d;
    };
    const reply = (t, after, ms) => {
      const d = wait();
      setTimeout(() => { d.remove(); say(t); after && after(); }, ms || 620);
    };
    const chips = list => {
      opts.innerHTML = '';
      list.forEach(o => {
        const b = document.createElement('button');
        b.type = 'button'; b.textContent = o.l;
        b.onclick = () => { ask(o.l); };
        opts.appendChild(b);
      });
    };
    const contactBlock = () =>
      `Here's how to reach the team directly:<br>` +
      `<b>WhatsApp</b> <a href="https://wa.me/${C.wa || '923028056789'}" target="_blank" rel="noopener">${C.phoneDisplay || '0302 8056789'}</a><br>` +
      `<b>Phone</b> ${C.phone2Display || '0344 6267693'}<br>` +
      `<b>Email</b> ${C.email || ''}`;

    const SUGGEST = [
      { l: 'Fees' }, { l: 'Class timings' }, { l: 'Where are classes?' },
      { l: 'O Level syllabus' }, { l: 'How do I register?' }, { l: 'Student portal' }
    ];

    function ask(text) {
      say(text, 'u');
      opts.innerHTML = '';
      const m = match(text);
      if (m) {
        reply(m.entry.a, () => chips(SUGGEST.slice(0, 4)), 620);
      } else {
        reply(
          `I don't have a confident answer for that one — I'd rather send you to a human than guess.<br><br>${contactBlock()}`,
          () => chips(SUGGEST.slice(0, 4)), 700);
      }
    }

    const start = () => {
      body.innerHTML = '';
      reply("Assalam-o-Alaikum! I'm the <b>SMK Assistant</b>. Ask me anything — fees, timings, syllabus, locations, the portal, or where to start with a topic you're stuck on.",
        () => chips(SUGGEST), 420);
    };

    const submit = () => {
      const v = input.value.trim();
      if (!v) return;
      input.value = '';
      ask(v);
    };
    sendBtn && sendBtn.addEventListener('click', submit);
    input && input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });

    aiBtn.addEventListener('click', () => {
      const o = bot.classList.toggle('open');
      aiBtn.setAttribute('aria-expanded', o);
      if (o && !started) { started = true; start(); }
      if (o && input) setTimeout(() => input.focus(), 320);
    });
    const x = $('.bot__x');
    x && x.addEventListener('click', () => bot.classList.remove('open'));
  }
})();

</script>
<script>
/* ==========================================================================
   SMK — portal.js
   Demo authentication + per-student course rendering.

   ⚠️  SECURITY: this is a FRONTEND DEMO. Credentials live in data.js, which
       any visitor can read via View Source. It proves the flow and the UI —
       it does not protect anything. Real accounts need a server.
   ========================================================================== */
(function () {
  'use strict';
  const $ = (s, c) => (c || document).querySelector(s);
  const $$ = (s, c) => Array.from((c || document).querySelectorAll(s));
  const KEY = 'smk_demo_session';

  const session = {
    get() { try { return JSON.parse(sessionStorage.getItem(KEY)); } catch (e) { return null; } },
    set(id) { sessionStorage.setItem(KEY, JSON.stringify({ id, at: Date.now() })); },
    clear() { sessionStorage.removeItem(KEY); }
  };

  /* ------------------------- LOGIN PAGE ------------------------- */
  const form = $('#loginForm');
  if (form) {
    const s = session.get();
    if (s && STUDENTS[s.id]) location.replace('course.html');

    form.addEventListener('submit', e => {
      e.preventDefault();
      const id = $('#sid').value.trim().toLowerCase();
      const pin = $('#spin').value.trim();
      const err = $('#loginErr');
      const stu = STUDENTS[id];

      if (!stu || stu.pin !== pin) {
        err.style.display = 'block';
        err.textContent = !stu
          ? `No student found with ID "${id || '—'}". Try st01, st02 or st03.`
          : 'That ID exists, but the access code is wrong.';
        form.classList.add('shake');
        setTimeout(() => form.classList.remove('shake'), 500);
        window.SMKsfx?.err();
        return;
      }
      err.style.display = 'none';
      window.SMKsfx?.ok();
      session.set(id);
      $('.login__c').style.transition = 'opacity .4s, transform .4s';
      $('.login__c').style.opacity = '0';
      $('.login__c').style.transform = 'translateY(-12px)';
      setTimeout(() => location.href = 'course.html', 400);
    });

    $$('[data-fill]').forEach(b => b.addEventListener('click', () => {
      $('#sid').value = b.dataset.fill;
      $('#spin').value = STUDENTS[b.dataset.fill].pin;
      $('#sid').focus();
    }));
  }

  /* ------------------------- COURSE PAGE ------------------------- */
  const root = $('#courseRoot');
  if (!root) return;

  const s = session.get();
  const stu = s && STUDENTS[s.id];
  if (!stu) { location.replace('portal.html'); return; }

  const course = COURSES[stu.course];
  const all = course.modules.flatMap(m => m.lectures);
  const done = all.filter(l => l.done).length;
  const pct = Math.round((done / all.length) * 100);

  const ICON = { video: '▶', live: '◉', paper: '✎', quiz: '✓' };
  const LABEL = { video: 'Recorded', live: 'Live · Zoom', paper: 'Past paper', quiz: 'Quiz' };

  /* header */
  $('#stuName').textContent = stu.name;
  $('#stuId').textContent = stu.id.toUpperCase();
  $('#cTitle').textContent = course.title;
  $('#cCode').textContent = course.code;
  $('#cBlurb').textContent = course.blurb;
  $('#cSession').textContent = stu.session;
  $('#cDone').textContent = done;
  $('#cTotal').textContent = all.length;
  $('#cPct').textContent = pct + '%';
  setTimeout(() => { $('#cBar').style.width = pct + '%'; }, 300);
  document.documentElement.style.setProperty('--gold-300', course.accent);

  /* modules + lectures — layout deliberately varies per module */
  const wrap = $('#modules');
  course.modules.forEach((mod, mi) => {
    const d = mod.lectures.filter(l => l.done).length;

    const h = document.createElement('div');
    h.className = 'modtitle';
    h.innerHTML = `<h3>${mod.name}</h3><i></i><span>${d}/${mod.lectures.length} DONE</span>`;
    wrap.appendChild(h);

    const grid = document.createElement('div');
    grid.className = 'lecgrid';
    mod.lectures.forEach((lec, li) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'lec' + (lec.kind === 'live' ? ' lec--live' : '') +
        // first card of every other module spans two columns — varied layout
        ((mi % 2 === 1 && li === 0) ? ' lec--wide' : '');
      b.setAttribute('data-rv', ''); b.style.setProperty('--d', li);
      // progress ring: 100% when complete, a stub arc when not started
      const C = 2 * Math.PI * 19;
      const off = lec.done ? 0 : C * 0.88;
      b.innerHTML = `
        <div class="lec__top">
          <div class="lec__ico">${ICON[lec.kind]}</div>
          <div style="display:flex;align-items:center;gap:10px">
            <span class="chip ${lec.done ? 'chip--done' : lec.kind === 'live' ? 'chip--live' : ''}">
              ${lec.done ? 'Completed' : lec.kind === 'live' ? 'Live' : 'Not started'}
            </span>
            <div class="ring">
              <svg viewBox="0 0 44 44">
                <circle class="bgc" cx="22" cy="22" r="19"></circle>
                <circle class="fgc" cx="22" cy="22" r="19"
                  stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${C.toFixed(1)}"
                  data-off="${off.toFixed(1)}"></circle>
              </svg>
              <span>${lec.done ? '100' : '0'}</span>
            </div>
          </div>
        </div>
        <h4>${lec.t}</h4>
        <div class="lec__meta"><span>${LABEL[lec.kind]}</span>·<span>${lec.dur}</span></div>
        <div class="lec__go">Open lecture <b>&rarr;</b></div>`;
      b.addEventListener('click', () => open(lec));
      grid.appendChild(b);
    });
    wrap.appendChild(grid);
  });

  /* animate progress rings when they enter the viewport */
  const ringIO = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    ringIO.unobserve(e.target);
    e.target.style.strokeDashoffset = e.target.dataset.off;
  }), { threshold: .5 });
  setTimeout(() => $$('.ring .fgc').forEach(c => ringIO.observe(c)), 100);
  window.SMKbind && window.SMKbind();

  /* re-observe newly injected reveal targets */
  const rio = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add('in'); rio.unobserve(e.target); }
  }), { threshold: .08 });
  $$('#modules [data-rv]').forEach(el => rio.observe(el));

  /* lecture player */
  function open(lec) {
    let inner, cta;

    if (lec.kind === 'live') {
      inner = `<div class="vframe" style="cursor:default"><div style="text-align:center;padding:24px">
          <div class="vplay" style="margin:0 auto 18px">◉</div>
          <b style="font-family:var(--display);font-size:1.2rem">Live Zoom session</b>
          <p class="muted" style="margin:10px auto 0;max-width:38ch;font-size:.85rem">
            ${lec.zoom ? 'Join link is ready.' : 'No Zoom link set yet. Add one to <code>zoom:</code> for this lecture in <code>the DATA block in this file</code>.'}
          </p></div></div>`;
      cta = lec.zoom
        ? `<a class="btn btn--gold" href="${lec.zoom}" target="_blank" rel="noopener">Join the session</a>`
        : `<button class="btn btn--line" disabled style="opacity:.55">Zoom link not set</button>`;
    } else if (lec.youtube) {
      inner = `<div style="position:relative;aspect-ratio:16/9;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line)">
          <iframe style="position:absolute;inset:0;width:100%;height:100%" src="https://www.youtube.com/embed/${lec.youtube}"
            title="${lec.t}" frameborder="0" allowfullscreen
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture"></iframe></div>`;
      cta = `<a class="btn btn--line" href="https://youtu.be/${lec.youtube}" target="_blank" rel="noopener">Open on YouTube</a>`;
    } else {
      inner = `<div class="vframe" style="cursor:default"><div style="text-align:center;padding:24px">
          <div class="vplay" style="margin:0 auto 18px">▶</div>
          <b style="font-family:var(--display);font-size:1.2rem">Video not linked yet</b>
          <p class="muted" style="margin:10px auto 0;max-width:40ch;font-size:.85rem">
            Add the YouTube ID to <code>youtube:</code> for this lecture in
            <code>the DATA block in this file</code> and it will play right here.
          </p></div></div>`;
      cta = `<a class="btn btn--line" href="${CHANNEL}" target="_blank" rel="noopener">Visit the channel</a>`;
    }

    window.SMKmodal(`
      <span class="chip chip--gold">${LABEL[lec.kind]} · ${lec.dur}</span>
      <h3 style="margin:14px 0 20px">${lec.t}</h3>
      ${inner}
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:24px">
        ${cta}
        <button class="btn btn--line" data-nb2="progress tracking">Mark as complete</button>
      </div>`);

    $('[data-nb2]')?.addEventListener('click', () => {
      window.SMKtoast?.('Progress saving needs a backend — not in this build.');
    });
  }

  /* logout */
  $('#logout')?.addEventListener('click', () => {
    session.clear();
    location.href = 'portal.html';
  });
})();

</script>
</body>
</html>
